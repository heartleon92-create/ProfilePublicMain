<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Studio — Profile Craft Studio</title>

<style>
/* ============================================================
   PROFILE CRAFT STUDIO · DESIGN STUDIO
   Scoped with .ds-* (page) and .tpl-* (template) prefixes.
   ============================================================ */

:root{
  /* ---- Surfaces: deeper background, white cards, richer contrast ---- */
  --ds-bg:#E8ECF4;
  --ds-surface:#FFFFFF;
  --ds-surface-2:#F4F7FC;
  --ds-text:#0F1B3D;
  --ds-text-2:#33465F;
  --ds-muted:#5A6B85;
  --ds-border:rgba(15,27,61,0.14);
  --ds-border-strong:rgba(15,27,61,0.24);
  --ds-hairline:rgba(15,27,61,0.08);

  /* ---- Primary ---- */
  --ds-blue:#315EFB;
  --ds-blue-deep:#1D3FC7;
  --ds-blue-tint:rgba(49,94,251,0.10);
  --ds-blue-border:rgba(49,94,251,0.30);

  /* ---- Category accents ---- */
  --ds-portfolio:#315EFB;
  --ds-developer:#0D9488;
  --ds-creative:#7C3AED;
  --ds-business:#0891B2;
  --ds-minimal:#475569;
  --ds-editorial:#B45309;

  /* ---- Geometry (reduced, professional) ---- */
  --ds-r-sm:8px;    /* buttons */
  --ds-r:10px;      /* search, chips, modals */
  --ds-r-lg:12px;   /* cards */

  /* ---- Depth ---- */
  --ds-shadow-sm:0 1px 2px rgba(15,27,61,0.06), 0 2px 6px rgba(15,27,61,0.06);
  --ds-shadow:0 8px 20px -12px rgba(15,27,61,0.18), 0 2px 6px -2px rgba(15,27,61,0.08);
  --ds-shadow-lg:0 22px 48px -22px rgba(15,27,61,0.32), 0 4px 12px -4px rgba(15,27,61,0.10);

  --ds-sidebar-w:282px;
  --ds-sidebar-w-collapsed:88px;
  --ds-ease:cubic-bezier(.4,0,.2,1);

  --ds-font:"Myanmar Text","Noto Sans Myanmar","Padauk","Pyidaungsu",
            -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
            "Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}

body{
  font-family:var(--ds-font);
  font-size:14px;
  line-height:1.55;
  color:var(--ds-text);
  background:var(--ds-bg);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

#sidebar-container{display:contents;}

/* ============================================================
   SHELL
   ============================================================ */
.ds-shell{
  min-height:100vh;
  padding-inline-start:var(--ds-sidebar-w);
  transition:padding-inline-start .28s var(--ds-ease);
  display:flex;
  flex-direction:column;
}
html.pb-sidebar-collapsed .ds-shell{padding-inline-start:var(--ds-sidebar-w-collapsed);}
@media (max-width:1023px){
  .ds-shell,
  html.pb-sidebar-collapsed .ds-shell{padding-inline-start:0;}
}

/* ============================================================
   HEADER — subtle depth over the deeper background
   ============================================================ */
.ds-header{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  padding:16px 24px;
  background:rgba(255,255,255,0.95);
  backdrop-filter:saturate(160%) blur(12px);
  -webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--ds-border);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.6) inset,
    0 1px 3px rgba(15,27,61,0.04);
}
.ds-header__mobile{display:none;}
@media (max-width:767.98px){ .ds-header__mobile{display:inline-flex;} }

.ds-header__title{display:flex;flex-direction:column;min-width:0;gap:2px;}
.ds-crumbs{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--ds-muted);line-height:1.2;
}
.ds-crumbs svg{width:12px;height:12px;color:var(--ds-muted);}
.ds-crumbs strong{color:var(--ds-text);font-weight:700;}
.ds-h1{
  margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;
  color:var(--ds-text);line-height:1.2;
}
.ds-subtitle{
  margin:0;font-size:12.5px;color:var(--ds-muted);
  max-width:64ch;line-height:1.4;
}

.ds-header__spacer{flex:1 1 auto;}

.ds-count{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:999px;
  background:rgba(49,94,251,0.10);
  border:1px solid rgba(49,94,251,0.28);
  color:var(--ds-blue-deep);
  font-size:12px;font-weight:800;
  white-space:nowrap;
}
.ds-count svg{width:14px;height:14px;}

/* ============================================================
   MAIN
   ============================================================ */
.ds-main{
  flex:1 1 auto;
  padding:24px;
  max-width:1480px;
  width:100%;
  margin:0 auto;
  display:flex;flex-direction:column;gap:18px;
}
@media (max-width:767.98px){ .ds-main{padding:16px;gap:14px;} }

/* ============================================================
   BUTTONS
   ============================================================ */
.ds-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--ds-r-sm);
  border:1px solid transparent;
  font-family:inherit;font-size:13px;font-weight:600;line-height:1.2;
  cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .18s var(--ds-ease),
             color .18s var(--ds-ease),
             border-color .18s var(--ds-ease),
             box-shadow .18s var(--ds-ease),
             transform .12s var(--ds-ease);
}
.ds-btn:active{transform:translateY(1px);}
.ds-btn:focus-visible{outline:2px solid var(--ds-blue);outline-offset:2px;}
.ds-btn svg{width:16px;height:16px;flex:0 0 auto;}
.ds-btn[disabled]{opacity:.6;cursor:not-allowed;transform:none;}

.ds-btn--primary{
  background:var(--ds-blue);
  color:#FFFFFF;
  border-color:var(--ds-blue-deep);
  box-shadow:0 6px 14px -8px rgba(49,94,251,0.6);
}
.ds-btn--primary:hover:not([disabled]){
  background:var(--ds-blue-deep);
  box-shadow:0 10px 22px -10px rgba(49,94,251,0.7);
}

.ds-btn--ghost{
  background:var(--ds-surface);
  color:var(--ds-text);
  border-color:var(--ds-border);
}
.ds-btn--ghost:hover:not([disabled]){
  background:rgba(49,94,251,0.08);
  border-color:var(--ds-blue-border);
  color:var(--ds-blue-deep);
}
.ds-btn--sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.ds-btn--icon{width:34px;height:34px;padding:0;justify-content:center;}

/* ============================================================
   TOOLBAR — search
   ============================================================ */
.ds-toolbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.ds-search{
  position:relative;
  display:flex;align-items:center;
  flex:1 1 380px;min-width:0;height:46px;
  padding:0 12px 0 42px;
  border:1px solid var(--ds-border);
  border-radius:var(--ds-r);
  background:var(--ds-surface);
  box-shadow:var(--ds-shadow-sm);
  transition:border-color .18s var(--ds-ease),
             box-shadow .18s var(--ds-ease);
}
.ds-search:focus-within{
  border-color:var(--ds-blue);
  box-shadow:0 0 0 4px var(--ds-blue-tint), var(--ds-shadow-sm);
}
.ds-search__icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--ds-blue);
  pointer-events:none;
}
.ds-search input{
  width:100%;height:100%;padding:0;
  border:0;background:transparent;
  font-family:inherit;font-size:14px;color:var(--ds-text);
  outline:none;
}
.ds-search input::placeholder{color:var(--ds-muted);}
.ds-search__clear{
  display:none;
  width:26px;height:26px;margin-inline-start:8px;
  border:1px solid var(--ds-border);border-radius:6px;
  background:#FFFFFF;color:var(--ds-text-2);cursor:pointer;
  align-items:center;justify-content:center;
}
.ds-search__clear:hover{background:var(--ds-blue-tint);border-color:var(--ds-blue-border);color:var(--ds-blue-deep);}
.ds-search__clear:focus-visible{outline:2px solid var(--ds-blue);outline-offset:2px;}
.ds-search__clear svg{width:12px;height:12px;}
.ds-search.has-value .ds-search__clear{display:inline-flex;}

/* ============================================================
   FILTERS — tinted per-category, saturated when active
   ============================================================ */
.ds-filters{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.ds-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 12px;
  border-radius:var(--ds-r);
  border:1px solid var(--ds-border);
  background:var(--ds-surface);
  color:var(--ds-text-2);
  font-family:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;
  transition:background-color .18s var(--ds-ease),
             border-color .18s var(--ds-ease),
             color .18s var(--ds-ease),
             box-shadow .18s var(--ds-ease);
}
.ds-chip:hover{border-color:var(--ds-border-strong);}
.ds-chip:focus-visible{outline:2px solid var(--ds-blue);outline-offset:2px;}

/* Per-category tinted backgrounds */
.ds-chip[data-cat="all"]{
  background:rgba(49,94,251,0.06);
  border-color:rgba(49,94,251,0.22);
  color:var(--ds-blue-deep);
}
.ds-chip[data-cat="portfolio"]{
  background:rgba(49,94,251,0.06);
  border-color:rgba(49,94,251,0.22);
  color:var(--ds-blue-deep);
}
.ds-chip[data-cat="developer"]{
  background:rgba(13,148,136,0.06);
  border-color:rgba(13,148,136,0.24);
  color:#0F766E;
}
.ds-chip[data-cat="creative"]{
  background:rgba(124,58,237,0.06);
  border-color:rgba(124,58,237,0.24);
  color:#6D28D9;
}
.ds-chip[data-cat="business"]{
  background:rgba(8,145,178,0.06);
  border-color:rgba(8,145,178,0.24);
  color:#0E7490;
}
.ds-chip[data-cat="minimal"]{
  background:rgba(71,85,105,0.06);
  border-color:rgba(71,85,105,0.24);
  color:#334155;
}
.ds-chip[data-cat="editorial"]{
  background:rgba(180,83,9,0.06);
  border-color:rgba(180,83,9,0.24);
  color:#92400E;
}

.ds-chip__dot{
  width:8px;height:8px;border-radius:50%;
  background:currentColor;opacity:.85;
}
.ds-chip__count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:18px;padding:0 6px;
  border-radius:999px;
  background:rgba(15,27,61,0.08);
  font-size:10.5px;font-weight:800;color:inherit;
}

/* Active: saturated color, matching category identity */
.ds-chip[aria-pressed="true"]{
  color:#FFFFFF;
  font-weight:800;
  box-shadow:0 4px 12px -6px rgba(15,27,61,0.20);
}
.ds-chip[aria-pressed="true"] .ds-chip__dot{
  background:rgba(255,255,255,0.85);
  opacity:1;
}
.ds-chip[aria-pressed="true"] .ds-chip__count{
  background:rgba(255,255,255,0.22);
  color:#FFFFFF;
}

.ds-chip[data-cat="all"][aria-pressed="true"]{
  background:var(--ds-blue);
  border-color:var(--ds-blue-deep);
}
.ds-chip[data-cat="portfolio"][aria-pressed="true"]{
  background:var(--ds-portfolio);
  border-color:#1D3FC7;
}
.ds-chip[data-cat="developer"][aria-pressed="true"]{
  background:var(--ds-developer);
  border-color:#0F766E;
}
.ds-chip[data-cat="creative"][aria-pressed="true"]{
  background:var(--ds-creative);
  border-color:#6D28D9;
}
.ds-chip[data-cat="business"][aria-pressed="true"]{
  background:var(--ds-business);
  border-color:#0E7490;
}
.ds-chip[data-cat="minimal"][aria-pressed="true"]{
  background:var(--ds-minimal);
  border-color:#334155;
}
.ds-chip[data-cat="editorial"][aria-pressed="true"]{
  background:var(--ds-editorial);
  border-color:#92400E;
}

/* ============================================================
   GALLERY
   ============================================================ */
.ds-gallery{
  display:grid;
  gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
}

.ds-card{
  position:relative;
  display:flex;flex-direction:column;
  background:var(--ds-surface);
  border:1px solid var(--ds-border);
  border-radius:var(--ds-r-lg);
  box-shadow:var(--ds-shadow-sm);
  overflow:hidden;
  transition:transform .22s var(--ds-ease),
             box-shadow .22s var(--ds-ease),
             border-color .22s var(--ds-ease);
}
@media (hover:hover){
  .ds-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--ds-shadow);
    border-color:var(--ds-border-strong);
  }
}
.ds-card.is-applied{
  border-color:var(--ds-blue);
  box-shadow:0 0 0 2px var(--ds-blue-tint), var(--ds-shadow-sm);
}

/* Preview stage — now an <a> that navigates to preview.html */
.ds-card__stage{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  background:var(--ds-surface-2);
  cursor:pointer;
  display:block;
  width:100%;
  padding:0;
  border:none;
  border-bottom:1px solid var(--ds-hairline);
  text-align:left;
  text-decoration:none;
  color:inherit;
  transition:filter .18s var(--ds-ease);
}
.ds-card__stage:hover{filter:brightness(0.97);}
.ds-card__stage:focus-visible{
  outline:2px solid var(--ds-blue);
  outline-offset:-2px;
}
.ds-card__stage > .tpl-page{
  position:absolute;
  top:0;left:0;right:0;
  font-size:6px; /* thumbnail scale */
  pointer-events:none;
  min-height:100%;
}

/* Applied badge */
.ds-card__badge{
  position:absolute;
  top:10px;right:10px;
  display:none;
  align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;
  background:var(--ds-blue);
  color:#FFFFFF;
  font-size:10.5px;font-weight:800;
  letter-spacing:.02em;text-transform:uppercase;
  box-shadow:0 2px 8px -2px rgba(49,94,251,0.55);
  z-index:2;
}
.ds-card__badge svg{width:11px;height:11px;}
.ds-card.is-applied .ds-card__badge{display:inline-flex;}

/* Body — more breathing room, 2-line clamped description */
.ds-card__body{
  padding:14px 16px 12px;
  display:flex;flex-direction:column;gap:8px;
  min-width:0;
}
.ds-card__row{
  display:flex;align-items:center;gap:8px;justify-content:space-between;
  flex-wrap:wrap;
}
.ds-card__name{
  margin:0;font-size:15px;font-weight:800;color:var(--ds-text);
  letter-spacing:-.005em;line-height:1.3;
}
.ds-card__cat{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:999px;
  font-size:10.5px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;
  white-space:nowrap;
  border:1px solid transparent;
}
.ds-card__cat::before{
  content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
}
.ds-card[data-cat="portfolio"] .ds-card__cat{
  background:rgba(49,94,251,0.10);color:var(--ds-portfolio);border-color:rgba(49,94,251,0.30);
}
.ds-card[data-cat="developer"] .ds-card__cat{
  background:rgba(13,148,136,0.10);color:var(--ds-developer);border-color:rgba(13,148,136,0.30);
}
.ds-card[data-cat="creative"] .ds-card__cat{
  background:rgba(124,58,237,0.10);color:var(--ds-creative);border-color:rgba(124,58,237,0.30);
}
.ds-card[data-cat="business"] .ds-card__cat{
  background:rgba(8,145,178,0.10);color:var(--ds-business);border-color:rgba(8,145,178,0.30);
}
.ds-card[data-cat="minimal"] .ds-card__cat{
  background:rgba(71,85,105,0.10);color:var(--ds-minimal);border-color:rgba(71,85,105,0.30);
}
.ds-card[data-cat="editorial"] .ds-card__cat{
  background:rgba(180,83,9,0.10);color:var(--ds-editorial);border-color:rgba(180,83,9,0.30);
}

.ds-card__desc{
  margin:0;font-size:13px;color:var(--ds-text-2);line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:calc(1.55em * 2);
}

.ds-card__foot{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px 14px;
  border-top:1px solid var(--ds-hairline);
  margin-top:auto;
}
.ds-card__foot .ds-btn{flex:1 1 auto;}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.ds-empty{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:48px 20px;text-align:center;
  border:1px dashed var(--ds-border-strong);
  border-radius:var(--ds-r-lg);
  background:var(--ds-surface-2);
  color:var(--ds-muted);
}
.ds-empty svg{width:28px;height:28px;color:var(--ds-blue);opacity:.85;}
.ds-empty strong{color:var(--ds-text);font-size:14px;font-weight:800;}
.ds-empty p{margin:0;font-size:12.5px;max-width:360px;}

/* ============================================================
   CONFIRM MODAL (the only modal now)
   ============================================================ */
.ds-modal{
  position:fixed;inset:0;z-index:300;
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.ds-modal.is-open{display:flex;}
.ds-modal__scrim{
  position:absolute;inset:0;
  background:rgba(15,27,61,0.55);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  animation:ds-fade-in .2s var(--ds-ease);
}
@keyframes ds-fade-in{from{opacity:0;}}
@keyframes ds-modal-in{
  from{opacity:0;transform:translateY(8px) scale(.985);}
}

.ds-modal__panel{
  position:relative;
  width:min(480px, 96vw);
  max-height:min(92vh, 1000px);
  background:var(--ds-surface);
  border-radius:var(--ds-r);
  box-shadow:var(--ds-shadow-lg);
  display:flex;flex-direction:column;min-height:0;
  overflow:hidden;
  animation:ds-modal-in .22s var(--ds-ease);
}

.ds-modal__head{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--ds-hairline);
  background:var(--ds-surface-2);
  flex-wrap:wrap;
}
.ds-modal__title-block{min-width:0;flex:1 1 auto;}
.ds-modal__title{margin:0;font-size:15px;font-weight:800;color:var(--ds-text);}
.ds-modal__cat{
  display:inline-block;margin-top:2px;
  font-size:10.5px;font-weight:800;
  color:var(--ds-muted);text-transform:uppercase;letter-spacing:.06em;
}

.ds-modal__close{
  flex:0 0 auto;
  width:34px;height:34px;
  border-radius:var(--ds-r-sm);
  border:1px solid var(--ds-border);
  background:var(--ds-surface);
  color:var(--ds-text-2);
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.ds-modal__close:hover{background:var(--ds-blue-tint);border-color:var(--ds-blue-border);color:var(--ds-blue-deep);}
.ds-modal__close:focus-visible{outline:2px solid var(--ds-blue);outline-offset:2px;}
.ds-modal__close svg{width:16px;height:16px;}

.ds-modal__body{
  padding:18px;
  display:flex;flex-direction:column;gap:12px;
  font-size:13px;color:var(--ds-text-2);
  line-height:1.6;
}
.ds-modal__body p{margin:0;}
.ds-modal__body strong{color:var(--ds-text);font-weight:800;}

.ds-modal__foot{
  border-top:1px solid var(--ds-hairline);
  padding:12px 18px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--ds-surface);
}
.ds-modal__foot .ds-btn{flex:0 0 auto;}
.ds-modal__spacer{flex:1 1 auto;}

/* ============================================================
   TOAST
   ============================================================ */
.ds-toasts{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;
}
.ds-toast{
  pointer-events:auto;
  padding:10px 16px;border-radius:var(--ds-r-sm);
  background:#0F1B3D;color:#FFFFFF;
  font-size:12.5px;font-weight:600;
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:var(--ds-shadow-lg);
  display:inline-flex;align-items:center;gap:8px;
  animation:ds-toast-in .22s var(--ds-ease);
}
@keyframes ds-toast-in{from{opacity:0;transform:translateY(8px);}}
.ds-toast--ok{background:#047857;}
.ds-toast--err{background:#B91C1C;}

/* ============================================================
   TEMPLATE PAGE — SHARED BASE
   All sizes use em so the whole preview scales via
   `font-size` on the wrapper.
   ============================================================ */
.tpl-page{
  display:flex;
  flex-direction:column;
  gap:1.6em;
  background:#FFFFFF;
  color:#0F1B3D;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size:14px;
  line-height:1.55;
  padding:2.2em;
  min-height:100%;

<!-- ============================================================

     ============================================================ -->
<script>
(function () {
  function mount() {
    fetch('sidebar.html', { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');

        if (!document.getElementById('pb-sidebar-styles')) {
          var s = doc.getElementById('pb-sidebar-styles');
          if (s) document.head.appendChild(document.importNode(s, true));
        }

        var fragment = doc.querySelector('[data-pb-sidebar-root]');
        if (!fragment) return;
        if (!document.querySelector('[data-pb-sidebar-root]')) {
          document.getElementById('sidebar-container')
            .appendChild(document.importNode(fragment, true));
        }

        var src = doc.getElementById('pb-sidebar-script');
        if (src && !document.getElementById('pb-sidebar-script-runtime')) {
          var runtime = document.createElement('script');
          runtime.id = 'pb-sidebar-script-runtime';
          runtime.textContent = src.textContent;
          document.body.appendChild(runtime);
        }

        if (window.PBSidebar) {
          window.PBSidebar.init();
          try { window.PBSidebar.setActive('design'); } catch (e) {}
        }
      })
      .catch(function (err) {
        console.warn('[design-studio] sidebar load failed:', err);
        var m = document.getElementById('sidebar-container');
        if (m) {
          m.innerHTML =
            '<p style="padding:12px 18px;font:12px system-ui;color:#b42318;' +
            'border:1px solid #f7d2cc;background:#fdecec;border-radius:6px;margin:12px">' +
            'Sidebar could not be loaded. Serve this page from a local server ' +
            '(not file://) and refresh.</p>';
        }
      });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else { mount(); }
})();
</script>

      description: 'A clean, single-column layout focused on essential information.',

      render: function () {

    },

    {
      id: 'editorial',
      name: 'Editorial Portfolio',
      category: 'editorial',
      description: 'A serif-led, magazine-style layout with a byline, drop cap, and pull quote.',
      theme: { primary: '#B45309', font: 'serif', radius: 4, mode: 'light' },
      render: function () {
        return '' +
          '<div class="tpl-page tpl-page--edit">' +
            '<section class="tpl-page__hero-ed">' +
              '<span class="tpl-page__eyebrow">Selected writing</span>' +
              '<h1>Notes on design, craft, and small tools.</h1>' +
              '<p class="tpl-page__byline">By Alex Lee · 2024</p>' +
            '</section>' +
            '<section class="tpl-page__article">' +
              '<p class="tpl-page__drop">Design is a way of thinking. Below are notes from the last year of building tools and interfaces.</p>' +
              '<blockquote class="tpl-page__pull-edit">"The best interfaces feel invisible."</blockquote>' +
              '<div class="tpl-page__article-cols">' +
                '<p>We spend hours choosing the right grey, the right breakpoint, the right empty state.</p>' +
                '<p>The goal is not a perfect pixel — it is a calm experience that lets the work speak.</p>' +
              '</div>' +
            '</section>' +
            '<section class="tpl-page__block">' +
              '<h2>Recent pieces</h2>' +
              '<ol class="tpl-page__numbered">' +
                '<li><span>01</span> On not shipping</li>' +
                '<li><span>02</span> A softer default</li>' +
                '<li><span>03</span> Notes on notation</li>' +
              '</ol>' +
            '</section>' +
            '<footer class="tpl-page__foot">Published in Yangon</footer>' +
          '</div>';
      }
    }
  ];

  var CATEGORIES = [
    { key: 'all',          label: 'All Designs' },
    { key: 'portfolio',    label: 'Portfolio' },
    { key: 'developer',    label: 'Developer' },
    { key: 'creative',     label: 'Creative' },
    { key: 'business',     label: 'Business' },
    { key: 'minimal',      label: 'Minimal' },
    { key: 'editorial',    label: 'Editorial' }
  ];

  /* ============================================================
     STATE
     ============================================================ */
  var state = {
    search: '',
    category: 'all',
    appliedId: readApplied(),
    confirmId: null
  };

  /* ============================================================
     HELPERS
     ============================================================ */
  function $(id){ return document.getElementById(id); }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function findTemplate(id){
    return TEMPLATES.find(function (t) { return t.id === id; });
  }

  function previewHref(id){
    return PREVIEW_URL + '?template=' + encodeURIComponent(id);
  }

  /* ============================================================
     PERSISTENCE
     ============================================================ */
  function readApplied(){
    try {
      var v = window.localStorage.getItem(STORAGE_KEY);
      if (v && findTemplate(v)) return v;
    } catch (e) {}
    return null;
  }

  function writeApplied(id){
    try { window.localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    window.PB_APPLIED_TEMPLATE = id;

    var tpl = findTemplate(id);
    if (tpl && tpl.theme) {
      try {
        window.localStorage.setItem(
          THEME_STORAGE_KEY,
          JSON.stringify(tpl.theme)
        );
      } catch (e) {}
    }

    try {
      document.dispatchEvent(new CustomEvent(APPLIED_EVENT, {
        detail: { id: id }
      }));
    } catch (e) {}
  }

  /* ============================================================
     TOAST
     ============================================================ */
  function toast(msg, kind){
    var root = $('ds-toasts');
    if (!root) return;
    var el = document.createElement('div');
    el.className = 'ds-toast' + (kind ? ' ds-toast--' + kind : '');
    el.setAttribute('role', 'status');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .25s ease, transform .25s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(function () { el.remove(); }, 260);
    }, 2400);
  }

  /* ============================================================
     HEADER COUNT
     ============================================================ */
  function renderCount(){
    var el = $('ds-count-label');
    if (!el) return;
    var n = TEMPLATES.length;
    el.textContent = n + (n === 1 ? ' design available' : ' designs available');
  }

  /* ============================================================
     FILTERS
     ============================================================ */
  function categoryCount(cat){
    if (cat === 'all') return TEMPLATES.length;
    return TEMPLATES.filter(function (t) {
      return t.category === cat && matchesSearch(t);
    }).length;
  }

  function renderFilters(){
    var nav = $('ds-filters');
    if (!nav) return;
    nav.innerHTML = '';

    CATEGORIES.forEach(function (c) {
      var count = categoryCount(c.key);
      if (c.key !== 'all' && count === 0) return;

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ds-chip';
      btn.setAttribute('data-cat', c.key);
      btn.setAttribute('aria-pressed', String(state.category === c.key));
      btn.innerHTML =
        '<span class="ds-chip__dot" aria-hidden="true"></span>' +
        '<span>' + esc(c.label) + '</span>' +
        '<span class="ds-chip__count">' + count + '</span>';
      btn.addEventListener('click', function () {
        state.category = c.key;
        renderFilters();
        renderGallery();
      });
      nav.appendChild(btn);
    });
  }

  /* ============================================================
     GALLERY
     ============================================================ */
  function matchesSearch(t){
    if (!state.search) return true;
    var q = state.search.toLowerCase();
    return (t.name + ' ' + t.description + ' ' + t.category).toLowerCase().indexOf(q) !== -1;
  }
  function matchesCategory(t){
    return state.category === 'all' || t.category === state.category;
  }
  function visibleTemplates(){
    return TEMPLATES.filter(function (t) {
      return matchesSearch(t) && matchesCategory(t);
    });
  }

  function renderGallery(){
    var gallery = $('ds-gallery');
    var empty = $('ds-empty');
    if (!gallery) return;

    var visible = visibleTemplates();
    gallery.innerHTML = '';

    if (!visible.length) {
      if (empty) empty.hidden = false;
      return;
    }
    if (empty) empty.hidden = true;

    visible.forEach(function (tpl) {
      gallery.appendChild(renderCard(tpl));
    });
  }

  function renderCard(tpl){
    var isApplied = tpl.id === state.appliedId;
    var href = previewHref(tpl.id);

    var card = document.createElement('article');
    card.className = 'ds-card' + (isApplied ? ' is-applied' : '');
    card.setAttribute('data-cat', tpl.category);
    card.setAttribute('data-id', tpl.id);

    /* Stage — a real <a> link to preview.html */
    var stage = document.createElement('a');
    stage.className = 'ds-card__stage';
    stage.href = href;
    stage.setAttribute('aria-label', 'Preview ' + tpl.name);
    stage.innerHTML = tpl.render();

    var badge = document.createElement('span');
    badge.className = 'ds-card__badge';
    badge.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M20 6L9 17l-5-5"/></svg>' +
      'Applied';
    stage.appendChild(badge);

    card.appendChild(stage);

    /* Body */
    var body = document.createElement('div');
    body.className = 'ds-card__body';

    var row = document.createElement('div');
    row.className = 'ds-card__row';

    var name = document.createElement('h3');
    name.className = 'ds-card__name';
    name.textContent = tpl.name;
    row.appendChild(name);

    var cat = document.createElement('span');
    cat.className = 'ds-card__cat';
    cat.textContent = (CATEGORIES.find(function (c) {
      return c.key === tpl.category;
    }) || { label: tpl.category }).label;
    row.appendChild(cat);

    body.appendChild(row);

    var desc = document.createElement('p');
    desc.className = 'ds-card__desc';
    desc.textContent = tpl.description;
    body.appendChild(desc);

    card.appendChild(body);

    /* Footer — Preview is a real <a>, Use Design stays a button */
    var foot = document.createElement('div');
    foot.className = 'ds-card__foot';

    var previewLink = document.createElement('a');
    previewLink.className = 'ds-btn ds-btn--ghost ds-btn--sm';
    previewLink.href = href;
    previewLink.textContent = 'Preview';
    foot.appendChild(previewLink);

    if (isApplied) {
      var appliedBtn = document.createElement('button');
      appliedBtn.type = 'button';
      appliedBtn.className = 'ds-btn ds-btn--primary ds-btn--sm';
      appliedBtn.disabled = true;
      appliedBtn.textContent = '✓ Applied';
      foot.appendChild(appliedBtn);
    } else {
      var applyBtn = document.createElement('button');
      applyBtn.type = 'button';
      applyBtn.className = 'ds-btn ds-btn--primary ds-btn--sm';
      applyBtn.setAttribute('data-action', 'apply');
      applyBtn.textContent = 'Use Design';
      foot.appendChild(applyBtn);
    }

    card.appendChild(foot);

    /* Card-level click handler — only intercepts Apply, lets
       Preview links and stage links navigate normally. */
    card.addEventListener('click', function (e) {
      var target = e.target;
      if (!target || typeof target.closest !== 'function') return;
      var applyEl = target.closest('[data-action="apply"]');
      if (!applyEl) return;
      e.preventDefault();
      openConfirm(tpl.id);
    });

    return card;
  }

  /* ============================================================
     CONFIRM MODAL
     ============================================================ */
  var lastFocused = null;

  function openConfirm(id){
    var tpl = findTemplate(id);
    if (!tpl) return;
    if (tpl.id === state.appliedId) {
      toast('This design is already applied.', 'ok');
      return;
    }

    lastFocused = document.activeElement;
    state.confirmId = id;

    $('ds-confirm-title').textContent = 'Apply ' + tpl.name + '?';
    $('ds-confirm-cat').textContent = (CATEGORIES.find(function (c) {
      return c.key === tpl.category;
    }) || { label: tpl.category }).label;

    $('ds-confirm-body').innerHTML =
      '<p>Your content, images, and installed functions stay the same. ' +
      'Only the layout and default styling of this website will change.</p>' +
      '<p>You can customize colors, fonts, and buttons afterwards in the ' +
      '<strong>Theme</strong> module.</p>';

    var modal = $('ds-confirm-modal');
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    setTimeout(function () {
      var apply = $('ds-confirm-apply');
      if (apply) apply.focus();
    }, 60);
  }

  function closeConfirm(){
    var modal = $('ds-confirm-modal');
    if (!modal) return;
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    state.confirmId = null;
    if (lastFocused && typeof lastFocused.focus === 'function') {
      try { lastFocused.focus(); } catch (e) {}
    }
    lastFocused = null;
  }

  /* ============================================================
     APPLY
     ============================================================ */
  function applyTemplate(id){
    var tpl = findTemplate(id);
    if (!tpl) return;
    writeApplied(tpl.id);
    state.appliedId = tpl.id;
    renderGallery();
    toast('Applied: ' + tpl.name, 'ok');
  }

  /* ============================================================
     SEARCH
     ============================================================ */
  function setupSearch(){
    var input = $('ds-search');
    var wrap = $('ds-search-wrap');
    var clear = $('ds-search-clear');
    if (!input) return;

    function updateWrap(){
      if (wrap) wrap.classList.toggle('has-value', input.value.length > 0);
    }

    input.addEventListener('input', function () {
      state.search = input.value;
      updateWrap();
      renderFilters();
      renderGallery();
    });

    if (clear) {
      clear.addEventListener('click', function () {
        input.value = '';
        state.search = '';
        updateWrap();
        renderFilters();
        renderGallery();
        input.focus();
      });
    }
  }

  /* ============================================================
     CONFIRM MODAL EVENT WIRING
     ============================================================ */
  function setupModals(){
    /* Close buttons + scrim */
    document.querySelectorAll('#ds-confirm-modal [data-close]').forEach(function (el) {
      el.addEventListener('click', closeConfirm);
    });
    document.querySelectorAll('#ds-confirm-modal .ds-modal__scrim').forEach(function (scrim) {
      scrim.addEventListener('click', closeConfirm);
    });

    /* Apply button inside confirm */
    var confirmApply = $('ds-confirm-apply');
    if (confirmApply) {
      confirmApply.addEventListener('click', function () {
        if (!state.confirmId) return;
        var id = state.confirmId;
        closeConfirm();
        applyTemplate(id);
      });
    }

    /* Escape closes the confirm modal */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' && e.key !== 'Esc') return;
      if ($('ds-confirm-modal').classList.contains('is-open')) closeConfirm();
    });
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    renderCount();
    renderFilters();
    renderGallery();
    setupSearch();
    setupModals();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
