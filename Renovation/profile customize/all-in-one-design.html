<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Builder — Admin</title>
<style>
/* ==========================================================================
   1. Design tokens
   ========================================================================== */
:root{
  --bg:#f6f7fb;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --surface-3:#f2f4f7;
  --border:#e4e7ec;
  --border-strong:#d0d5dd;
  --text:#101828;
  --text-2:#475467;
  --text-3:#667085;
  --accent:#4f46e5;
  --accent-2:#4338ca;
  --accent-soft:#eef2ff;
  --success:#067647; --success-soft:#ecfdf3; --success-border:#abefc6;
  --warn:#b54708;    --warn-soft:#fffaeb;    --warn-border:#fedf89;
  --danger:#b42318;  --danger-soft:#fef3f2;  --danger-border:#fda29b;
  --radius:10px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 6px 18px rgba(16,24,40,.10);
  --shadow-lg:0 18px 48px rgba(16,24,40,.18);
  --sidebar-w:258px;
  --sidebar-w-collapsed:74px;
  --header-h:60px;
}

/* ==========================================================================
   2. Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.modal-open{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--text-2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.icon{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.gap-sm{gap:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:10px}

/* ==========================================================================
   3. App shell
   ========================================================================== */
.app{display:flex;min-height:100vh;align-items:flex-start}

/* --- Sidebar --- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 auto;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  background:var(--surface);
  border-right:1px solid var(--border);
  transition:width .18s ease;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  height:var(--header-h);padding:0 16px;flex:0 0 auto;
  border-bottom:1px solid var(--border);
}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#6d5ef0);
  color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;
  display:grid;place-items:center;
}
.brand-text{font-weight:650;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.nav{flex:1 1 auto;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-group-label{
  font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-3);padding:10px 12px 6px;white-space:nowrap;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border:0;border-radius:9px;background:transparent;
  color:var(--text-2);font-size:13.5px;font-weight:550;text-align:left;
  cursor:pointer;width:100%;white-space:nowrap;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-2);font-weight:650}
.nav-item.active .icon{stroke-width:2}
.nav-item .label{overflow:hidden;text-overflow:ellipsis}
.sidebar-foot{flex:0 0 auto;padding:10px;border-top:1px solid var(--border)}
.account{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.account:hover{background:var(--surface-3)}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;font-size:12px;font-weight:700;
  border:1px solid #dfe3ff;
}
.account-info{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.account-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-handle{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Collapsed sidebar (desktop) */
body.collapsed .sidebar{width:var(--sidebar-w-collapsed)}
body.collapsed .brand-text,
body.collapsed .nav-item .label,
body.collapsed .nav-group-label,
body.collapsed .account-info,
body.collapsed .account .icon-btn{display:none}
body.collapsed .brand{justify-content:center;padding:0}
body.collapsed .nav-item{justify-content:center;padding:10px}
body.collapsed .account{justify-content:center;padding:6px}

/* --- Main --- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.header{
  position:sticky;top:0;z-index:30;
  height:var(--header-h);flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 20px;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(160%) blur(8px);
  border-bottom:1px solid var(--border);
}
.header-left,.header-right{display:flex;align-items:center;gap:10px;min-width:0}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);min-width:0}
.breadcrumb .sep{color:var(--border-strong)}
.breadcrumb strong{color:var(--text);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  display:inline-grid;place-items:center;width:34px;height:34px;
  border:1px solid transparent;border-radius:8px;background:transparent;
  color:var(--text-2);cursor:pointer;flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.select-sm{padding:6px 8px;font-size:12.5px;width:auto;border-radius:8px}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;
  border:1px solid var(--border);border-radius:999px;background:#fff;cursor:pointer;
}
.user-chip:hover{background:var(--surface-2)}
.user-chip .avatar{width:26px;height:26px;font-size:11px}
.user-chip .uname{font-size:13px;font-weight:600;white-space:nowrap}
.dropdown{position:relative}
.dropdown-menu{
  position:absolute;right:0;top:calc(100% + 8px);min-width:210px;
  background:#fff;border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-md);padding:6px;z-index:50;
}
.dropdown-menu[hidden]{display:none}
.dropdown-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:9px 10px;border:0;border-radius:8px;background:transparent;
  font-size:13.5px;color:var(--text-2);cursor:pointer;text-align:left;
}
.dropdown-item:hover{background:var(--surface-3);color:var(--text)}
.dropdown-sep{height:1px;background:var(--border);margin:6px 4px}
.dropdown-head{padding:8px 10px 6px}
.dropdown-head .n{font-size:13px;font-weight:650}
.dropdown-head .h{font-size:12px;color:var(--text-3)}

/* Notice banner */
.notice{
  display:flex;align-items:center;gap:10px;
  margin:16px 24px 0;padding:10px 14px;
  background:var(--accent-soft);border:1px solid #dfe3ff;border-radius:var(--radius);
  font-size:13px;color:var(--accent-2);
}
.notice .icon{flex:0 0 auto}
.notice .grow{flex:1 1 auto}

/* Content */
.content{
  flex:1 1 auto;width:100%;max-width:1480px;margin:0 auto;
  padding:24px;outline:none;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ==========================================================================
   4. Layout helpers
   ========================================================================== */
.page-head{margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:680;letter-spacing:-.02em}
.page-head p{color:var(--text-2);font-size:13.5px;margin-top:4px;max-width:70ch}
.page-grid{display:grid;grid-template-columns:minmax(0,1fr) 386px;gap:20px;align-items:start}
.page-grid.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:1240px){.page-grid{grid-template-columns:minmax(0,1fr)}}
.sticky-col{position:sticky;top:calc(var(--header-h) + 20px)}
@media (max-width:1240px){.sticky-col{position:static}}

/* ==========================================================================
   5. Components
   ========================================================================== */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  padding:18px;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{font-size:14.5px;font-weight:660;letter-spacing:-.01em}
.card-head p{font-size:12.5px;color:var(--text-3);margin-top:3px;max-width:62ch}
.card-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:9px;border:1px solid transparent;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  background:#fff;color:var(--text);transition:background .12s,border-color .12s,box-shadow .12s;
}
.btn .icon{width:16px;height:16px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn-secondary{border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.btn-danger{border-color:var(--danger-border);color:var(--danger);background:#fff}
.btn-danger:hover:not(:disabled){background:var(--danger-soft)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-sm .icon{width:14px;height:14px}
.btn-block{width:100%}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:640;
  border:1px solid transparent;white-space:nowrap;
}
.badge-neutral{background:var(--surface-3);color:var(--text-2);border-color:var(--border)}
.badge-accent{background:var(--accent-soft);color:var(--accent-2);border-color:#dfe3ff}
.badge-success{background:var(--success-soft);color:var(--success);border-color:var(--success-border)}
.badge-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.badge-danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-border)}

.status-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.status-dot.live{background:#12b76a;box-shadow:0 0 0 3px rgba(18,183,106,.16)}
.status-dot.draft{background:#f79009;box-shadow:0 0 0 3px rgba(247,144,9,.16)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > label,.field > .label{font-size:12.5px;font-weight:640;color:var(--text-2)}
.input,.select,.textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border-strong);
  border-radius:9px;background:#fff;color:var(--text);
  font:inherit;font-size:13.5px;
  transition:border-color .12s,box-shadow .12s;
}
.textarea{resize:vertical;min-height:80px}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.14);
}
.input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:11.5px;color:var(--text-3)}
.field-error{font-size:11.5px;color:var(--danger);font-weight:600}
.field-error[hidden]{display:none}
.form-grid{display:grid;gap:0 16px}
.form-grid.two{grid-template-columns:1fr 1fr}
@media (max-width:700px){.form-grid.two{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--border);margin-top:6px}

/* Switch */
.switch{position:relative;display:inline-flex;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:#d0d5dd;border-radius:999px;transition:background .15s}
.switch .track::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.25);transition:transform .15s;
}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:disabled + .track{opacity:.45;cursor:not-allowed}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* Segmented control */
.segmented{display:inline-flex;padding:3px;gap:2px;background:var(--surface-3);border-radius:9px;border:1px solid var(--border)}
.segmented button{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border:0;border-radius:7px;background:transparent;
  font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;
}
.segmented button .icon{width:15px;height:15px}
.segmented button.active{background:#fff;color:var(--text);box-shadow:var(--shadow-sm)}

/* Tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;padding-bottom:0}
.tab{
  padding:9px 14px;border:0;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--text-3);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-2);border-bottom-color:var(--accent)}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.stat-card{
  display:flex;flex-direction:column;gap:4px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:border-color .12s,box-shadow .12s,transform .12s;
}
.stat-card:hover{border-color:#c7cdfb;box-shadow:var(--shadow-md)}
.stat-icon{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-2);margin-bottom:6px;
}
.stat-label{font-size:12.5px;color:var(--text-3);font-weight:600}
.stat-value{font-size:17px;font-weight:680;letter-spacing:-.02em;word-break:break-word}
.stat-hint{font-size:11.5px;color:var(--text-3)}

/* Hero */
.hero{
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  background:linear-gradient(180deg,#f7f8ff,#ffffff);
  border:1px solid #e6e8fb;border-radius:var(--radius-lg);padding:20px;
}
.hero h2{font-size:17px;font-weight:680;letter-spacing:-.02em}
.hero p{font-size:13px;color:var(--text-2);margin-top:4px;max-width:60ch}
.eyebrow{font-size:11.5px;font-weight:680;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-2);margin-bottom:6px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}

/* Publication row */
.pub-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pub-status{display:flex;align-items:center;gap:12px;min-width:0}
.pub-status .icon-wrap{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--success-soft);color:var(--success);flex:0 0 auto;
}
.domain-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;word-break:break-all}
.domain-link .icon{width:14px;height:14px}

/* Checklist */
.checklist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.check-item{display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:8px}
.check-item:hover{background:var(--surface-2)}
.check-item .cb{
  width:20px;height:20px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;
  border:1.5px solid var(--border-strong);background:#fff;color:transparent;
}
.check-item.done .cb{background:var(--success);border-color:var(--success);color:#fff}
.check-item .cb .icon{width:13px;height:13px;stroke-width:2.6}
.check-item .txt{flex:1 1 auto;font-size:13.5px;min-width:0}
.check-item.done .txt{color:var(--text-3);text-decoration:line-through;text-decoration-color:#cbd2dd}
.progress{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:10px 0 6px}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}

/* Section list (Builder) */
.section-list{display:flex;flex-direction:column;gap:8px}
.section-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:#fff;
  transition:border-color .12s,box-shadow .12s,opacity .12s;
}
.section-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.section-row.dragging{opacity:.45;border-style:dashed}
.section-row.drop-target{border-color:var(--accent);background:var(--accent-soft)}
.drag-handle{
  display:grid;place-items:center;width:24px;height:28px;flex:0 0 auto;
  border:0;border-radius:6px;background:transparent;color:var(--text-3);cursor:grab;
}
.drag-handle:hover{background:var(--surface-3);color:var(--text-2)}
.drag-handle:disabled{opacity:.35;cursor:not-allowed}
.section-main{flex:1 1 auto;min-width:0}
.section-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:640}
.section-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.section-row .row-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}

/* Site preview canvas */
.preview-panel .preview-frame{
  border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-3);
  padding:10px;
}
.preview-panel .preview-frame.desktop .site{width:100%}
.preview-panel .preview-frame.mobile{display:flex;justify-content:center}
.preview-panel .preview-frame.mobile .site{width:250px}
.site{
  --pv-bg:#fff;--pv-card:#f8fafc;--pv-text:#111827;--pv-muted:#6b7280;--pv-accent:#4f46e5;
  --pv-font:inherit;
  background:var(--pv-bg);color:var(--pv-text);font-family:var(--pv-font);
  border-radius:10px;overflow:hidden;font-size:11px;border:1px solid rgba(16,24,40,.07);
}
.site-nav{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid rgba(16,24,40,.08)}
.site-logo{width:20px;height:20px;border-radius:6px;background:var(--pv-accent);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.site-links{display:flex;gap:8px;color:var(--pv-muted);font-size:9px}
.site-hero{padding:16px 12px 14px}
.site-hero h4{margin:0 0 5px;font-size:15px;letter-spacing:-.02em}
.site-hero p{margin:0 0 9px;color:var(--pv-muted);font-size:9.5px;line-height:1.55}
.site-cta{display:inline-block;background:var(--pv-accent);color:#fff;padding:5px 10px;border-radius:6px;font-size:9px;font-weight:650}
.site-block{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid rgba(16,24,40,.07);font-size:9.5px}
.site-block .dotline{flex:1 1 auto;height:4px;border-radius:3px;background:var(--pv-card);margin-left:12px;max-width:120px}
.site-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 12px;border-top:1px solid rgba(16,24,40,.07)}
.site-tile{height:44px;border-radius:7px;background:var(--pv-card);border:1px solid rgba(16,24,40,.06)}
.site-foot{padding:9px 12px;border-top:1px solid rgba(16,24,40,.07);color:var(--pv-muted);font-size:8.5px;text-align:center}

/* Theme cards */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.theme-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;
  overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
  transition:border-color .12s,box-shadow .12s;
}
.theme-card:hover{box-shadow:var(--shadow-md)}
.theme-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.theme-preview{height:126px;padding:12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--border)}
.theme-preview .tp-bar{display:flex;align-items:center;justify-content:space-between}
.theme-preview .tp-logo{width:16px;height:16px;border-radius:5px}
.theme-preview .tp-lines{display:flex;gap:5px}
.theme-preview .tp-lines i{display:block;width:16px;height:3px;border-radius:2px;opacity:.5}
.theme-preview .tp-title{height:9px;width:62%;border-radius:3px;margin-top:6px}
.theme-preview .tp-text{height:4px;width:88%;border-radius:2px;opacity:.55}
.theme-preview .tp-text.short{width:64%}
.theme-preview .tp-cta{width:44px;height:14px;border-radius:5px;margin-top:auto}
.theme-body{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1 1 auto}
.swatches{display:flex;gap:6px}
.swatch{width:22px;height:22px;border-radius:6px;border:1px solid rgba(16,24,40,.1)}
.theme-body .btn{margin-top:auto}

/* Media library */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.media-card{
  border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden;
  cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow-sm);
  transition:border-color .12s,box-shadow .12s,transform .12s;
}
.media-card:hover{border-color:#c7cdfb;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.media-thumb{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--surface-3)}
.media-meta{padding:9px 11px}
.media-name{font-size:12.5px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{position:relative;flex:1 1 220px;min-width:160px}
.toolbar .search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);width:16px;height:16px}
.toolbar .search .input{padding-left:33px}

/* Empty / loading states */
.empty-state{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  padding:48px 20px;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);
  background:var(--surface-2);color:var(--text-2);
}
.empty-state .icon{width:30px;height:30px;color:var(--text-3)}
.empty-state h3{font-size:14px;font-weight:660;color:var(--text)}
.empty-state p{font-size:12.5px;max-width:44ch}
.spinner{
  width:14px;height:14px;border-radius:50%;flex:0 0 auto;
  border:2px solid currentColor;border-right-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{
  background:linear-gradient(90deg,var(--surface-3) 25%,#eef0f4 37%,var(--surface-3) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{
  text-align:left;padding:10px 14px;background:var(--surface-2);
  font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--text)}

/* Breakdown lists */
.breakdown{display:flex;flex-direction:column;gap:11px}
.bd-row{display:flex;flex-direction:column;gap:5px}
.bd-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.bd-top .n{color:var(--text-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-top .v{color:var(--text-3);font-variant-numeric:tabular-nums}
.bd-bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bd-bar > span{display:block;height:100%;background:var(--accent);border-radius:999px}

/* Chart */
.chart-wrap{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;font-size:12px;color:var(--text-2)}
.chart-legend .k{display:inline-flex;align-items:center;gap:6px}
.chart-legend .sw{width:10px;height:10px;border-radius:3px}
svg.chart{display:block;width:100%;height:auto}
.chart-axis{font-size:10px;fill:#98a2b3;font-family:inherit}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{
  content:"";position:absolute;left:17px;top:8px;bottom:8px;width:2px;background:var(--border);
}
.tl-item{position:relative;display:flex;gap:14px;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:relative;z-index:1;width:36px;height:36px;flex:0 0 auto;border-radius:50%;
  display:grid;place-items:center;background:#fff;border:1px solid var(--border);
  color:var(--text-2);
}
.tl-dot.t-publish{background:var(--success-soft);border-color:var(--success-border);color:var(--success)}
.tl-dot.t-content{background:var(--accent-soft);border-color:#dfe3ff;color:var(--accent-2)}
.tl-dot.t-theme{background:#f4f3ff;border-color:#e0defb;color:#6941c6}
.tl-dot.t-visibility{background:var(--warn-soft);border-color:var(--warn-border);color:var(--warn)}
.tl-body{flex:1 1 auto;min-width:0;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tl-body h4{font-size:13.5px;font-weight:650}
.tl-body p{font-size:12.5px;color:var(--text-2);margin-top:2px}
.tl-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}

/* Guide */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.guide-card{
  border:1px solid var(--border);border-radius:12px;background:#fff;padding:16px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm);
}
.guide-card h4{font-size:13.5px;font-weight:660}
.guide-card p{font-size:12.5px;color:var(--text-2);flex:1 1 auto}
.accordion{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}
.acc-item + .acc-item{border-top:1px solid var(--border)}
.acc-btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:13px 16px;border:0;background:transparent;cursor:pointer;text-align:left;
  font-size:13.5px;font-weight:640;color:var(--text);
}
.acc-btn:hover{background:var(--surface-2)}
.acc-btn .icon{transition:transform .15s;color:var(--text-3)}
.acc-btn[aria-expanded="true"] .icon{transform:rotate(180deg)}
.acc-panel{padding:0 16px 14px;font-size:13px;color:var(--text-2);display:none}
.acc-panel.open{display:block}
.acc-panel ol,.acc-panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}

/* Modal */
.modal-root{position:fixed;inset:0;z-index:100;display:none}
.modal-root.open{display:block}
.modal-backdrop{
  position:absolute;inset:0;background:rgba(16,24,40,.5);
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:fade .14s ease;
}
.modal{
  position:relative;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);
  width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;
  animation:pop .16s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal.lg{max-width:760px}
.modal.sm{max-width:420px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:670}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}

/* Toasts */
.toast-root{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(360px,calc(100vw - 36px))}
.toast{
  display:flex;align-items:flex-start;gap:10px;
  background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:11px;padding:11px 13px;box-shadow:var(--shadow-md);
  font-size:13px;animation:slideIn .18s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.success{border-left-color:var(--success)}
.toast.warn{border-left-color:#f79009}
.toast.error{border-left-color:var(--danger)}
.toast .icon{width:17px;height:17px;margin-top:1px;flex:0 0 auto}
.toast.success .icon{color:var(--success)}
.toast.error .icon{color:var(--danger)}
.toast.warn .icon{color:#f79009}
.toast .grow{flex:1 1 auto;color:var(--text-2)}

/* Scrim for mobile drawer */
.scrim{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:39}

/* ==========================================================================
   6. Responsive
   ========================================================================== */
@media (max-width:960px){
  .sidebar{
    position:fixed;left:0;top:0;transform:translateX(-100%);
    transition:transform .2s ease;width:282px;box-shadow:var(--shadow-lg);
  }

  body.collapsed .brand{justify-content:flex-start;padding:0 16px}

  body.collapsed .account{justify-content:flex-start;padding:8px}
  .content{padding:16px}
  .notice{margin:12px 16px 0}
  .header{padding:0 14px}
  .user-chip .uname{display:none}
}
@media (max-width:640px){
  .page-head h1{font-size:18px}
  .card{padding:15px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .modal{max-height:92vh}
  .modal-foot{justify-content:stretch}
  .modal-foot .btn{flex:1 1 auto}
}
@media (max-width:420px){
  .stat-grid{grid-template-columns:1fr}
}

/* Deterministic analytics series (30 days) */
function seededRandom(seed){
  let s = seed;
  return function(){ s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
}
const ANALYTICS_DAYS = (function(){
  const rand = seededRandom(20250401);
  const out = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000);
    const base = 34 + (29 - i) * 1.35;
    const views = Math.round(base + rand() * 26);
    const visitors = Math.round(views * (0.56 + rand() * 0.14));
    out.push({ date:d, views, visitors });
  }
  return out;
})();

/* ==========================================================================

function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtNum(n){ return Number(n).toLocaleString('en-US'); }
function fmtDate(d){
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function greeting(){
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
}
function badge(text, kind){
  return '<span class="badge badge-' + (kind || 'neutral') + '">' + esc(text) + '</span>';
}
function btn(label, opts){
  opts = opts || {};
  const variant = opts.variant || 'secondary';
  const attrs = [];
  if (opts.action) attrs.push('data-action="' + opts.action + '"');
  if (opts.page) attrs.push('data-page="' + opts.page + '"');
  if (opts.id) attrs.push('data-id="' + opts.id + '"');
  if (opts.tab) attrs.push('data-tab="' + opts.tab + '"');
  if (opts.extra) attrs.push(opts.extra);
  if (opts.ariaLabel) attrs.push('aria-label="' + opts.ariaLabel + '"');
  const cls = 'btn btn-' + variant + (opts.size === 'sm' ? ' btn-sm' : '') + (opts.block ? ' btn-block' : '');
  return '<button type="button" class="' + cls + '" ' + attrs.join(' ') + '>' +
    (opts.iconName ? icon(opts.iconName) : '') +
    (label ? '<span>' + esc(label) + '</span>' : '') +
    '</button>';
}
function cardHead(title, desc, right){
  return '<div class="card-head"><div><h3>' + esc(title) + '</h3>' +
    (desc ? '<p>' + desc + '</p>' : '') + '</div>' +
    (right ? '<div class="card-actions">' + right + '</div>' : '') + '</div>';
}
function pageHead(title, desc){
  return '<div class="page-head"><h1>' + esc(title) + '</h1>' +
    (desc ? '<p>' + esc(desc) + '</p>' : '') + '</div>';
}

/* --- Toasts --- */
function toast(message, kind){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  const ic = kind === 'success' ? 'check' : kind === 'error' ? 'warning' : kind === 'warn' ? 'warning' : 'info';
  el.innerHTML = icon(ic) + '<div class="grow">' + esc(message) + '</div>';
  root.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
    el.style.transition = 'opacity .2s, transform .2s';
    setTimeout(function(){ el.remove(); }, 220);
  }, 3200);
}

/* --- Modal --- */
let pendingConfirm = null;
function openModal(opts){
  const root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal-backdrop" data-action="close-modal">' +
      '<div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
        '<div class="modal-head"><h3>' + esc(opts.title) + '</h3>' +
          '<button class="icon-btn" data-action="close-modal" aria-label="Close dialog">' + icon('x') + '</button>' +
        '</div>' +
        '<div class="modal-body">' + opts.body + '</div>' +
        (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>' +
    '</div>';
  root.classList.add('open');
  document.body.classList.add('modal-open');
  const focusable = root.querySelector('input, select, textarea, button:not([data-action="close-modal"])');
  if (focusable) focusable.focus();
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.classList.remove('open');
  root.innerHTML = '';
  document.body.classList.remove('modal-open');
  pendingConfirm = null;
}
function confirmDialog(opts){
  pendingConfirm = opts.onConfirm;
  openModal({
    title: opts.title,
    size:'sm',
    body:'<p style="font-size:13.5px;color:var(--text-2);line-height:1.6">' + esc(opts.message) + '</p>',
    footer: btn('Cancel', { action:'close-modal' }) +
            btn(opts.confirmLabel || 'Confirm', { variant:'danger', action:'confirm-accept' })
  });
}

/* --- Clipboard --- */
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function(){ toast('Link copied to clipboard.', 'success'); },
      function(){ toast('Copy failed — select the link manually.', 'error'); }
    );
  } else {
    toast('Clipboard API unavailable in this browser.', 'warn');
  }
}

function thumbURI(img){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + img.c1 + '"/><stop offset="1" stop-color="' + img.c2 + '"/></linearGradient></defs>' +
    '<rect width="400" height="300" fill="url(#g)"/>' +
    '<circle cx="118" cy="112" r="56" fill="rgba(255,255,255,0.22)"/>' +
    '<rect x="182" y="150" width="150" height="13" rx="6.5" fill="rgba(255,255,255,0.38)"/>' +
    '<rect x="182" y="178" width="98" height="11" rx="5.5" fill="rgba(255,255,255,0.24)"/>' +
    '<rect x="24" y="236" width="352" height="40" rx="10" fill="rgba(255,255,255,0.14)"/>' +
    '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function filteredImages(){
  const q = state.imageQuery.trim().toLowerCase();
  let list = state.images.filter(function(img){
    const matchQ = !q || img.name.toLowerCase().indexOf(q) !== -1;
    const matchF = state.imageFormat === 'all' || img.format === state.imageFormat;
    return matchQ && matchF;
  });
  list = list.slice().sort(function(a, b){
    if (state.imageSort === 'name') return a.name.localeCompare(b.name);
    if (state.imageSort === 'format') return a.format.localeCompare(b.format) || a.name.localeCompare(b.name);
    return b.w - a.w;
  });
  return list;
}
function mediaGridHTML(){
  const list = filteredImages();

/* ---------- 7.6 Analytics ---------- */
function chartSVG(days){
  const w = 760, h = 250;
  const pad = { l: 44, r: 16, t: 16, b: 30 };
  const max = Math.max.apply(null, days.map(function(d){ return d.views; }));
  const top = Math.max(10, Math.ceil(max / 10) * 10);
  const stepX = (w - pad.l - pad.r) / (days.length - 1);
  function X(i){ return pad.l + i * stepX; }
  function Y(v){ return h - pad.b - (v / top) * (h - pad.t - pad.b); }

  function path(key){
    return days.map(function(d, i){
      return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(d[key]).toFixed(1);
    }).join(' ');
  }
  const areaPath = path('views') + ' L' + X(days.length - 1).toFixed(1) + ',' + (h - pad.b) +
                   ' L' + pad.l + ',' + (h - pad.b) + ' Z';

  let grid = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(function(f){
    const y = h - pad.b - f * (h - pad.t - pad.b);
    grid += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (w - pad.r) + '" y2="' + y + '" stroke="#eef0f4" stroke-width="1"/>' +
            '<text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="chart-axis">' + Math.round(top * f) + '</text>';
  });

  let xLabels = '';
  days.forEach(function(d, i){
    if (i % 5 === 0 || i === days.length - 1) {
      xLabels += '<text x="' + X(i) + '" y="' + (h - 8) + '" text-anchor="middle" class="chart-axis">' + fmtDate(d.date) + '</text>';
    }
  });

  const dots = days.map(function(d, i){
    return '<circle cx="' + X(i) + '" cy="' + Y(d.views) + '" r="2.6" fill="#4f46e5" opacity="0">' +
             '<title>' + fmtDate(d.date) + ' — ' + d.views + ' views, ' + d.visitors + ' visitors</title>' +
           '</circle>';
  }).join('');

  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Page views and unique visitors over the selected period">' +
      '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#4f46e5" stop-opacity="0.18"/>' +
        '<stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      grid +
      '<path d="' + areaPath + '" fill="url(#areaFill)"/>' +
      '<path d="' + path('views') + '" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + path('visitors') + '" fill="none" stroke="#12b76a" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xLabels +
    '</svg>';
}
function breakdownCard(title, items){
  const total = items.reduce(function(a, b){ return a + b.v; }, 0) || 1;
  return '<section class="card">' +
      cardHead(title) +
      '<div class="breakdown">' + items.map(function(it){
        const pct = Math.round(it.v / total * 100);
        return '<div class="bd-row">' +

function afterRender(){
  /* character counter */
  document.querySelectorAll('[data-counter]').forEach(function(el){
    const target = document.getElementById(el.dataset.counter);
    if (target) target.textContent = el.value.length;
  });
  /* builder drag & drop */
  if (state.page === 'builder') initDrag();
  /* keep search focus after re-render */
  if (state.page === 'images' && state.imageQuery) {
    const s = document.getElementById('imageSearch');
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
  if (state.page === 'guide' && state.guideQuery) {
    const s = document.getElementById('guideSearch');
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
}

/* ---------- Drag & drop reordering (Builder) ---------- */
function initDrag(){
  const list = document.getElementById('sectionList');
  if (!list) return;
  let dragId = null;

  list.querySelectorAll('.section-row').forEach(function(row){
    row.addEventListener('dragstart', function(e){
      if (row.getAttribute('draggable') !== 'true') { e.preventDefault(); return; }
      dragId = row.dataset.id;
      row.classList.add('dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
      }
    });
    row.addEventListener('dragend', function(){
      row.classList.remove('dragging');
      list.querySelectorAll('.section-row').forEach(function(r){ r.classList.remove('drop-target'); });
      dragId = null;
    });
    row.addEventListener('dragover', function(e){
      if (!dragId) return;
      e.preventDefault();
      if (row.dataset.id === dragId) return;
      row.classList.add('drop-target');
    });
    row.addEventListener('dragleave', function(){ row.classList.remove('drop-target'); });
    row.addEventListener('drop', function(e){
      e.preventDefault();
      row.classList.remove('drop-target');
      if (!dragId || row.dataset.id === dragId) return;
      const ids = Array.prototype.map.call(list.querySelectorAll('.section-row'), function(r){ return r.dataset.id; });
      const from = ids.indexOf(dragId);
      const to = ids.indexOf(row.dataset.id);
      if (from < 0 || to < 0) return;
      const moved = state.sections.splice(from, 1)[0];
      state.sections.splice(to, 0, moved);
      render();
      toast('Section reordered (prototype).', 'success');
    });
  });
}

/* ==========================================================================
   9. EVENT DELEGATION
   ========================================================================== */
document.addEventListener('click', function(e){
  const target = e.target.closest('[data-action]');
  if (!target) {
    /* close user menu when clicking elsewhere */
    const menu = document.getElementById('userMenu');
    if (menu && !menu.hidden && !e.target.closest('.dropdown')) {
      menu.hidden = true;
      document.getElementById('userChip').setAttribute('aria-expanded', 'false');
    }
    return;
  }
  const action = target.dataset.action;

  switch (action) {
    /* ---- shell ---- */
    case 'toggle-nav': {
      if (window.matchMedia('(max-width: 960px)').matches) {
        state.navOpen = !state.navOpen;
        document.body.classList.toggle('nav-open', state.navOpen);
        document.getElementById('navBtn').setAttribute('aria-expanded', String(state.navOpen));
      } else {
        state.collapsed = !state.collapsed;
        document.body.classList.toggle('collapsed', state.collapsed);
      }
      break;
    }
    case 'close-nav':
      state.navOpen = false;
      document.body.classList.remove('nav-open');
      document.getElementById('navBtn').setAttribute('aria-expanded', 'false');
      break;

    case 'goto':
      e.preventDefault();
      navigate(target.dataset.page);
      break;

    case 'dismiss-notice':
      state.noticeVisible = false;
      renderHeader();
      break;

    case 'toggle-user-menu': {
      const menu = document.getElementById('userMenu');
      menu.hidden = !menu.hidden;
      target.setAttribute('aria-expanded', String(!menu.hidden));
      break;
    }
    case 'logout':
      toast('Logout is not implemented in this UI prototype.', 'warn');
      break;
    case 'notifications':
      toast('You have no new notifications (prototype).', 'info');
      break;

    /* ---- modal ---- */
    case 'close-modal':
      if (e.target.closest('.modal') && !e.target.closest('[data-action="close-modal"]')) return;
      closeModal();
      break;

    case 'confirm-accept': {
      const fn = pendingConfirm;
      closeModal();
      if (typeof fn === 'function') fn();
      break;
    }

    /* ---- dashboard / publishing ---- */
    case 'publish': {
      const b = target;
      b.disabled = true;
      b.innerHTML = '<span class="spinner"></span><span>Publishing…</span>';
      setTimeout(function(){
        DATA.site.status = 'published';
        DATA.site.publishedAt = 'just now';
        toast('Changes published successfully (prototype only).', 'success');
        render();
      }, 950);
      break;
    }
    case 'unpublish':
      confirmDialog({
        title:'Unpublish website?',
        message:'Your site will stop being publicly accessible. You can publish it again at any time.',
        confirmLabel:'Unpublish',
        onConfirm:function(){
          DATA.site.status = 'draft';
          toast('Website unpublished (prototype only).', 'warn');
          render();
        }
      });
      break;
    case 'open-site':
      e.preventDefault();
      toast('Opening the site in a new tab is not available in this prototype.', 'info');
      break;
    case 'copy-link':
      e.preventDefault();
      copyText('https://' + DATA.site.subdomain);
      break;
    case 'replace-social':
      toast('Image replacement is not wired to storage in this prototype.', 'info');
      break;
    case 'reset-seo':
      e.preventDefault();
      render();
      toast('Form reset to saved values.', 'info');
      break;
    case 'save-seo': {
      e.preventDefault();
      const form = target.closest('form');
      const titleEl = form.querySelector('#seoTitle');
      const errEl = form.querySelector('#err-seoTitle');
      if (!titleEl.value.trim()) {
        titleEl.setAttribute('aria-invalid', 'true');
        errEl.hidden = false;
        titleEl.focus();
        toast('Please fix the highlighted field.', 'error');
        return;
      }
      titleEl.removeAttribute('aria-invalid');
      errEl.hidden = true;
      DATA.site.title = titleEl.value.trim();
      DATA.site.description = form.querySelector('#seoDesc').value.trim();
      toast('SEO metadata saved (prototype).', 'success');
      break;
    }

    /* ---- builder ---- */
    case 'edit-section': {
      const s = state.sections.filter(function(x){ return x.id === target.dataset.id; })[0];
      if (!s) return;
      openModal({
        title:'Edit — ' + s.name,
        size:'lg',
        body:
          '<div class="field"><label for="edSectionName">Section name</label>' +
            '<input id="edSectionName" class="input" value="' + esc(s.name) + '"' + (s.locked ? ' disabled' : '') + '></div>' +
          '<div class="field"><label for="edSectionLayout">Layout</label>' +
            '<select id="edSectionLayout" class="select">' +
              ['Full-width hero','Text + portrait','3-column grid','Progress bars','Masonry grid','4-column grid','Logo strip','Quote carousel','Fixed navigation bar']
                .map(function(l){ return '<option' + (l === s.layout ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') +
            '</select></div>' +
          '<div class="field"><label for="edSectionText">Content</label>' +
            '<textarea id="edSectionText" class="textarea" rows="4" placeholder="Section content…">' +
              'Sample content for the ' + esc(s.name) + ' section.' +
            '</textarea>' +
            '<p class="hint">Content editing is illustrative — nothing is persisted in this prototype.</p></div>',
        footer: btn('Cancel', { action:'close-modal' }) +
                btn('Save section', { action:'close-modal', variant:'primary' })
      });
      break;
    }
    case 'not-implemented':
      toast('This section type is not available in the prototype.', 'info');
      break;

    /* ---- theme ---- */
    case 'select-theme': {
      state.themeId = target.dataset.id;
      render();
      const t = currentTheme();
      toast('“' + t.name + '” theme selected (prototype).', 'success');
      break;
    }
    case 'apply-custom':
      toast('Customizations applied to the preview.', 'success');
      render();
      break;
    case 'reset-custom':
      state.custom = { accent:'', bg:'', font:'' };
      render();
      toast('Customizations reset.', 'info');
      break;

    /* ---- images ---- */
    case 'upload-image': {
      const input = document.getElementById('fileInput');
      if (input) input.click();
      break;
    }
    case 'open-image': {
      const img = state.images.filter(function(i){ return i.id === target.dataset.id; })[0];
      if (!img) return;
      openModal({
        title: img.name,
        size:'lg',
        body:
          '<img src="' + (img.dataUrl || thumbURI(img)) + '" alt="Preview of ' + esc(img.name) + '" style="width:100%;border-radius:12px;border:1px solid var(--border);display:block">' +
          '<div class="table-wrap" style="margin-top:16px"><table><tbody>' +
            '<tr><td style="color:var(--text-3);width:38%">Filename</td><td class="mono">' + esc(img.name) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Format</td><td>' + esc(img.format) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Dimensions</td><td>' + img.w + ' × ' + img.h + ' px</td></tr>' +
            '<tr><td style="color:var(--text-3)">File size</td><td>' + esc(img.size) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Uploaded</td><td>2 days ago</td></tr>' +
          '</tbody></table></div>',
        footer: btn('Close', { action:'close-modal' }) +
                btn('Copy filename', { action:'copy-filename', id:img.id, variant:'primary', iconName:'copy' })
      });
      break;
    }
    case 'copy-filename': {
      const img = state.images.filter(function(i){ return i.id === target.dataset.id; })[0];
      if (img) copyText(img.name);
      break;
    }
    case 'clear-image-filters':
      state.imageQuery = '';
      state.imageFormat = 'all';
      render();
      break;

    /* ---- analytics ---- */
    /* handled by change event */

    /* ---- history ---- */
    case 'history-details': {
      const h = DATA.history.filter(function(x){ return x.id === Number(target.dataset.id); })[0];
      if (!h) return;
      openModal({
        title:'Event details',
        body:
          '<div class="table-wrap"><table><tbody>' +
            '<tr><td style="color:var(--text-3);width:34%">Event</td><td>' + esc(h.title) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Description</td><td>' + esc(h.desc) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Type</td><td>' + esc(h.type) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Timestamp</td><td>' + esc(h.time) + '</td></tr>' +
            '<tr><td style="color:var(--text-3)">Reference</td><td class="mono">evt_' + h.id + '_' + h.type + '</td></tr>' +
          '</tbody></table></div>' +
          '<p class="hint" style="margin-top:12px">Details are illustrative sample data.</p>',
        footer: btn('Close', { action:'close-modal' })
      });
      break;
    }
    case 'history-restore': {
      const h = DATA.history.filter(function(x){ return x.id === Number(target.dataset.id); })[0];
      if (!h) return;
      confirmDialog({
        title:'Restore this version?',
        message:'Restoring “' + h.title + '” would replace your current content with the version saved at ' + h.time + '. This prototype does not perform real restoration.',
        confirmLabel:'Restore version',
        onConfirm:function(){ toast('Version restore is a prototype action only.', 'warn'); }
      });
      break;
    }
    case 'clear-history-filters':
      state.historyType = 'all';
      state.historyDate = 'all';
      render();
      break;

    /* ---- guide ---- */
    case 'toggle-guide':
      state.openGuide = state.openGuide === target.dataset.id ? null : target.dataset.id;
      render();
      break;
    case 'toggle-faq':
      state.openFaq = state.openFaq === target.dataset.key ? null : target.dataset.key;
      render();
      break;
    case 'clear-guide-search':
      state.guideQuery = '';
      render();
      break;

    /* ---- settings ---- */
    case 'settings-tab':
      state.settingsTab = target.dataset.tab;
      render();
      break;
    case 'save-settings': {
      e.preventDefault();
      const form = target.closest('form');
      let valid = true;
      form.querySelectorAll('[data-required]').forEach(function(input){
        const err = form.querySelector('#err-' + input.id);
        if (!input.value.trim()) {
          valid = false;
          input.setAttribute('aria-invalid', 'true');
          if (err) err.hidden = false;
        } else {
          input.removeAttribute('aria-invalid');
          if (err) err.hidden = true;
        }
      });
      if (!valid) { toast('Please fix the highlighted fields.', 'error'); return; }
      toast('Settings saved (prototype only — not persisted).', 'success');
      break;
    }
    case 'reset-settings':
      e.preventDefault();
      confirmDialog({
        title:'Reset this section?',
        message:'Any unsaved changes in this settings group will be discarded.',
        confirmLabel:'Reset',
        onConfirm:function(){ render(); toast('Settings reset to saved values.', 'info'); }
      });
      break;

    default:
      break;
  }
});

/* ---------- change events ---------- */
document.addEventListener('change', function(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  switch (action) {
    case 'toggle-setup': {
      const item = state.setup.filter(function(i){ return i.id === el.dataset.id; })[0];
      if (item) item.done = el.checked;
      render();
      break;
    }
    case 'toggle-section': {
      const s = state.sections.filter(function(i){ return i.id === el.dataset.id; })[0];
      if (s) {
        s.visible = el.checked;
        render();
        toast('“' + s.name + '” is now ' + (s.visible ? 'visible' : 'hidden') + '.', 'success');
      }
      break;
    }
    case 'image-format':
      state.imageFormat = el.value;
      document.getElementById('mediaGrid').innerHTML = mediaGridHTML();
      break;
    case 'image-sort':
      state.imageSort = el.value;
      document.getElementById('mediaGrid').innerHTML = mediaGridHTML();
      break;
    case 'analytics-range':
      state.analyticsRange = el.value;
      render();
      break;
    case 'history-type':
      state.historyType = el.value;
      render();
      break;
    case 'history-date':
      state.historyDate = el.value;
      render();
      break;
    case 'custom-color':
      state.custom[el.dataset.key] = el.value;
      render();
      break;
    case 'custom-font':
      state.custom.font = el.value;
      render();
      break;
    case 'lang-select':
      state.lang = el.value;
      toast(el.value === 'my' ? 'Burmese interface is not translated in this prototype.' : 'Language switched to English (prototype).', 'info');
      break;
    default:
      break;
  }
});

/* ---------- input events ---------- */
document.addEventListener('input', function(e){
  const el = e.target;

  /* live character counters */
  if (el.dataset && el.dataset.counter) {
    const t = document.getElementById(el.dataset.counter);
    if (t) t.textContent = el.value.length;
  }

  if (el.id === 'imageSearch') {
    state.imageQuery = el.value;
    const grid = document.getElementById('mediaGrid');
    if (grid) grid.innerHTML = mediaGridHTML();
    return;
  }
  if (el.id === 'guideSearch') {
    state.guideQuery = el.value;
    render();
    return;
  }

  /* live custom colour preview */
  if (el.dataset && el.dataset.action === 'custom-color') {
    state.custom[el.dataset.key] = el.value;
    const previews = document.querySelectorAll('.theme-preview, .site');
    previews.forEach(function(node){ /* live re-render handled on change */ });
  }
});

/* ---------- file upload (Images) ---------- */
document.addEventListener('change', function(e){
  if (e.target.id !== 'fileInput') return;
  const files = Array.prototype.slice.call(e.target.files || []);
  if (!files.length) return;
  files.forEach(function(file, idx){
    const reader = new FileReader();
    reader.onload = function(ev){
      state.images.unshift({
        id: 'upload-' + Date.now() + '-' + idx,
        name: file.name,
        format: (file.name.split('.').pop() || 'IMG').toUpperCase(),
        w: 1600, h: 1200,
        size: (file.size / 1024).toFixed(0) + ' KB',
        c1: '#6366f1', c2: '#c7d2fe',
        dataUrl: ev.target.result
      });
      if (document.getElementById('mediaGrid')) {
        document.getElementById('mediaGrid').innerHTML = mediaGridHTML();
      }
    };
    reader.readAsDataURL(file);
  });
  toast(files.length + ' image' + (files.length > 1 ? 's' : '') + ' added to the prototype library.', 'success');
  e.target.value = '';
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    const root = document.getElementById('modalRoot');
    if (root.classList.contains('open')) { closeModal(); return; }
    if (state.navOpen) {
      state.navOpen = false;
      document.body.classList.remove('nav-open');
      document.getElementById('navBtn').setAttribute('aria-expanded', 'false');
    }
  }
});

/* ---------- language switcher ---------- */
document.getElementById('langSelect').addEventListener('change', function(e){
  state.lang = e.target.value;
  toast(e.target.value === 'my'
    ? 'Burmese interface is not translated in this prototype.'
    : 'Language switched to English (prototype).', 'info');
});

/* ---------- hash routing ---------- */
window.addEventListener('hashchange', function(){
  if (suppressHash) { suppressHash = false; return; }
  const p = (location.hash || '').replace(/^#\//, '');
  if (PAGES[p] && p !== state.page) {
    state.page = p;
    render();
    window.scrollTo({ top:0 });
  }
});

/* ==========================================================================
   10. BOOT
   ========================================================================== */
(function init(){
  const initial = (location.hash || '').replace(/^#\//, '');
  state.page = PAGES[initial] ? initial : 'dashboard';
  if (!location.hash) {
    suppressHash = true;
    location.hash = '#/' + state.page;
  }
  render();
})();
</script>
