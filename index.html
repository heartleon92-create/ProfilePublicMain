<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfileCraft – Premium Profile Templates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ── root variables ── */
        :root {
            --basic-color: #4fbec9;
            --standard-color: #ff9f43;
            --premium-color: #ffd700;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --bg-light: #f8f9fa;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
            padding-bottom: 80px;
            width: 100%;
            overflow-x: hidden;
        }

        /* ── header ── */
        header {
            background-color: white;
            box-shadow: var(--shadow);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            width: 100%;
        }

        .header-main {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .logo-container img {
            max-height: 50px;
            width: auto;
            display: block;
        }

        .search-container {
            position: relative;
            flex: 1;
            min-width: 0;
            display: block;
        }

        .search-box {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--basic-color);
            box-shadow: 0 0 0 2px rgba(79, 190, 201, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .category-tags {
            display: none;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-tags.active {
            display: flex;
        }

        .category-tag {
            padding: 0.4rem 0.8rem;
            background-color: #f1f2f6;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .category-tag:hover,
        .category-tag.active {
            background-color: var(--basic-color);
            color: white;
        }

        .language-switcher {
            position: relative;
        }

        .language-btn {
            background: none;
            border: none;
            background-color: #f1f2f6;
            padding: 0.5rem 0.75rem;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .language-btn:hover {
            background-color: #dfe4ea;
        }

        .language-options {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 0.5rem;
            margin-top: 0.5rem;
            display: none;
            flex-direction: column;
            min-width: 120px;
            z-index: 101;
        }

        .language-options.active {
            display: flex;
        }

        .language-option {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .language-option:hover {
            background-color: #f1f2f6;
        }

        .filter-btn {
            background: none;
            border: none;
            background-color: #f1f2f6;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .filter-btn:hover {
            background-color: #dfe4ea;
        }

        /* ── main / grid ── */
        main {
            padding: 1.5rem 1rem;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            width: 100%;
        }

        /* ── profile card ── */
        .profile-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            width: 100%;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-image {
            height: 300px;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .card-image img {
            width: 100%;
            height: 150%;
            object-fit: cover;
            transition: var(--transition);
        }

        .profile-card:hover .card-image img {
            transform: scale(1.05);
        }

        .badges {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .basic-badge {
            background-color: var(--basic-color);
            color: white;
        }
        .standard-badge {
            background-color: var(--standard-color);
            color: white;
        }
        .premium-badge {
            background-color: var(--premium-color);
            color: var(--text-dark);
        }
        .popular-badge {
            background-color: #ff6b6b;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-content {
            padding: 1.25rem;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .profile-career {
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .price-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .current-price {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .original-price {
            text-decoration: line-through;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .discount-badge {
            background-color: #ff6b6b;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 1.5rem;
        }

        .cta-button {
            flex: 1;
            padding: 0.85rem 1.25rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            font-size: 0.95rem;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .cta-button:active {
            transform: translateY(0);
            animation: buttonClick 0.2s ease;
        }

        @keyframes buttonClick {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
            }
        }

        .buy-button {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .buy-button:hover {
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .buy-button::after {
            content: "→";
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .buy-button:hover::after {
            transform: translateX(3px);
        }

        .preview-button {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .preview-button:hover {
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .preview-button::before {
            content: "👁";
            font-size: 1.1em;
        }

        /* ── filter modal ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 2rem;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
        }

        .close-modal:hover {
            color: var(--text-dark);
            transform: rotate(90deg);
        }

        /* ── purpose tabs ── */
        .purpose-tabs {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .purpose-tab {
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            border: 2px solid #dfe6e9;
            background: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .purpose-tab:hover,
        .purpose-tab.active {
            border-color: var(--basic-color);
            background-color: var(--basic-color);
            color: white;
        }

        /* ── tier filters ── */
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .filter-option {
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            border: 2px solid #dfe6e9;
            background: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .filter-option:hover,
        .filter-option.active {
            border-color: var(--basic-color);
            background-color: var(--basic-color);
            color: white;
        }

        .filter-option.basic-option:hover,
        .filter-option.basic-option.active {
            border-color: var(--basic-color);
            background-color: var(--basic-color);
        }

        .filter-option.standard-option:hover,
        .filter-option.standard-option.active {
            border-color: var(--standard-color);
            background-color: var(--standard-color);
        }

        .filter-option.premium-option:hover,
        .filter-option.premium-option.active {
            border-color: var(--premium-color);
            background-color: var(--premium-color);
            color: var(--text-dark);
        }

        .career-filter {
            margin-bottom: 1.5rem;
        }

        .career-filter label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .career-filter select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background-color: white;
            transition: var(--transition);
        }

        .career-filter select:focus {
            outline: none;
            border-color: var(--basic-color);
            box-shadow: 0 0 0 2px rgba(79, 190, 201, 0.2);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .modal-button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        .apply-filters {
            background: linear-gradient(135deg, #4fbec9, #6c5ce7);
            color: white;
        }

        .apply-filters:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 190, 201, 0.3);
        }

        .reset-filters {
            background: #f1f2f6;
            color: var(--text-dark);
        }

        .reset-filters:hover {
            background: #dfe4ea;
        }

        /* ── no results ── */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1.2rem;
            color: var(--text-light);
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        /* ── myanmar font ── */
        @font-face {
            font-family: 'MyanmarFont';
            src: local('Myanmar Text'), local('Padauk'), local('Noto Sans Myanmar');
            unicode-range: U+1000-109F;
        }

        body.myanmar {
            font-family: 'MyanmarFont', 'Inter', sans-serif;
        }

        /* ── responsive ── */
        @media (max-width: 767px) {
            header {
                padding: 0.75rem;
                gap: 0.75rem;
            }
            .header-main {
                order: 1;
                width: 100%;
            }
            .header-controls {
                order: 3;
                width: 100%;
                justify-content: space-between;
            }
            .category-tags {
                order: 2;
                width: 100%;
                margin-top: 0.5rem;
                overflow-x: auto;
                padding-bottom: 0.25rem;
                justify-content: flex-start;
            }
            .search-container {
                width: 100%;
            }
            .language-btn span {
                display: none;
            }
            .category-tag {
                font-size: 0.7rem;
                padding: 0.35rem 0.7rem;
            }
            main {
                padding: 1rem;
            }
            .profiles-grid {
                gap: 1rem;
            }
            .card-image {
                height: 300px;
            }
            .profile-name {
                font-size: 1.1rem;
            }
            .profile-career {
                font-size: 0.9rem;
            }
            .current-price {
                font-size: 1rem;
            }
            .language-options {
                right: auto;
                left: 0;
                width: 100%;
            }
            .card-actions {
                flex-direction: column;
                gap: 10px;
            }
            .cta-button {
                width: 100%;
                padding: 0.75rem 1rem;
            }
        }

        @media (min-width: 768px) {
            header {
                padding: 1rem 2rem;
            }
            .category-tags {
                display: flex;
            }
            main {
                padding: 2rem;
            }
            .profiles-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }
            .modal-overlay {
                align-items: center;
            }
            .modal-content {
                width: 480px;
                border-radius: 12px;
                transform: scale(0.9) translateY(20px);
            }
            .modal-overlay.active .modal-content {
                transform: scale(1) translateY(0);
            }
        }

        @media (min-width: 1024px) {
            .profiles-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .header-controls {
                gap: 1rem;
            }
        }

        @media (max-width: 400px) {
            .header-controls {
                gap: 0.25rem;
            }
            .language-btn,
            .filter-btn {
                padding: 0.5rem;
            }
            .language-btn i:last-child,
            .filter-btn i:last-child {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <div class="logo-container">
                <img src="img/logoCrop.png" alt="Logo" />
            </div>
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-box" placeholder="Search profiles..." data-en-placeholder="Search profiles..." data-my-placeholder="ပရိုဖိုင်များ ရှာဖွေရန်..." />
            </div>
        </div>

        <div class="header-controls">
            <div class="category-tags active">
                <div class="category-tag active" data-category="all" data-en="All Template" data-my="အားလုံး">All Template</div>
                <div class="category-tag" data-category="popular" data-en="Popular" data-my="လူကြိုက်များ">Popular</div>
                <div class="category-tag" data-category="new" data-en="New" data-my="အသစ်">New</div>
            </div>

            <div class="language-switcher">
                <button class="language-btn">
                    <i class="fas fa-globe"></i>
                    <span id="current-language">English</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="language-options">
                    <button class="language-option" data-lang="en">English</button>
                    <button class="language-option" data-lang="my">Myanmar</button>
                </div>
            </div>

            <button class="filter-btn" id="filterBtn" data-en="Filter" data-my="စစ်ထုတ်ရန်">
                <i class="fas fa-filter"></i>
                <span>Filter</span>
            </button>
        </div>
    </header>

    <main>
        <div class="profiles-grid" id="profilesGrid"></div>
    </main>

    <!-- ─── FILTER MODAL ─── -->
    <div class="modal-overlay" id="filterModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" data-en="Filter Templates" data-my="ပုံစံများ စစ်ထုတ်ရန်">Filter Templates</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>

            <!-- Purpose Tabs -->
            <div class="purpose-tabs" id="purposeTabs">
                <button class="purpose-tab active" data-purpose="all" data-en="All Purpose" data-my="ရည်ရွယ်ချက်အားလုံး">All Purpose</button>
                <button class="purpose-tab" data-purpose="business" data-en="Business &amp; Shop" data-my="စီးပွားရေးနှင့်ဆိုင်">Business &amp; Shop</button>
                <button class="purpose-tab" data-purpose="personal_booking" data-en="Profile &amp; Booking" data-my="ကိုယ်ရေးနှင့်ကြိုတင်မှာ">Profile &amp; Booking</button>
            </div>

            <!-- Tier Filters -->
            <div class="filter-options" id="tierFilters">
                <button class="filter-option active" data-tier="all" data-en="All Tiers" data-my="အဆင့်အားလုံး">All Tiers</button>
                <button class="filter-option basic-option" data-tier="Basic" data-en="Basic" data-my="အခြေခံ">Basic</button>
                <button class="filter-option standard-option" data-tier="Standard" data-en="Standard" data-my="စံ">Standard</button>
                <button class="filter-option premium-option" data-tier="Premium" data-en="Premium" data-my="အဆင့်မြင့်">Premium</button>
            </div>

            <!-- Career Filter -->
            <div class="career-filter">
                <label for="careerSelect" data-en="Filter by Career:" data-my="အလုပ်အကိုင်ဖြင့် စစ်ထုတ်ရန်:">Filter by Career:</label>
                <select id="careerSelect">
                    <option value="all" data-en="All Careers" data-my="အလုပ်အကိုင်အားလုံး">All Careers</option>
                    <option value="Graphic Designer" data-en="Graphic Designer" data-my="ဂရပ်ဖစ်ဒီဇိုင်နာ">Graphic Designer</option>
                    <option value="Software Engineer" data-en="Software Engineer" data-my="ဆော့ဖ်ဝဲအင်ဂျင်နီယာ">Software Engineer</option>
                    <option value="Fashion Designer" data-en="Fashion Designer" data-my="ဖက်ရှင်ဒီဇိုင်နာ">Fashion Designer</option>
                    <option value="Photographer" data-en="Photographer" data-my="ဓာတ်ပုံဆရာ">Photographer</option>
                    <option value="Marketing Manager" data-en="Marketing Manager" data-my="စျေးကွက်ကိုင်ဆောင်မှူး">Marketing Manager</option>
                    <option value="Art Director" data-en="Art Director" data-my="အနုပညာညွှန်ကြားရေးမှူး">Art Director</option>
                    <option value="Senior UI/UX Designer" data-en="Senior UI/UX Designer" data-my="အကြီးတန်း UI/UX ဒီဇိုင်နာ">Senior UI/UX Designer</option>
                    <option value="Frontend Developer & UI Designer" data-en="Frontend Developer & UI Designer" data-my="Frontend Developer & UI Designer">Frontend Developer & UI Designer</option>
                    <option value="Mathematics Professor" data-en="Mathematics Professor" data-my="သင်္ချာပါမောက္ခ">Mathematics Professor</option>
                    <option value="Creative Director & UI/UX Designer" data-en="Creative Director & UI/UX Designer" data-my="Creative Director & UI/UX Designer">Creative Director & UI/UX Designer</option>
                    <option value="HR & Office Management Executive" data-en="HR & Office Management Executive" data-my="HR & Office Management Executive">HR & Office Management Executive</option>
                    <option value="Senior Cardiologist" data-en="Senior Cardiologist" data-my="အကြီးတန်းနှလုံးအထူးကု">Senior Cardiologist</option>
                    <option value="Executive Chef" data-en="Executive Chef" data-my="Executive Chef">Executive Chef</option>
                    <option value="Founder & CEO" data-en="Founder & CEO" data-my="Founder & CEO">Founder & CEO</option>
                    <option value="High School Teacher" data-en="High School Teacher" data-my="အထက်တန်းပြဆရာ">High School Teacher</option>
                    <option value="Creative Fashion Designer" data-en="Creative Fashion Designer" data-my="ဖန်တီးမှု ဖက်ရှင်ဒီဇိုင်နာ">Creative Fashion Designer</option>
                    <option value="Tech Startup Founder" data-en="Tech Startup Founder" data-my="Tech Startup Founder">Tech Startup Founder</option>
                    <option value="Acoustic Guitarist" data-en="Acoustic Guitarist" data-my="Acoustic ဂစ်တာသမား">Acoustic Guitarist</option>
                    <option value="Wedding & Portrait Photographer" data-en="Wedding & Portrait Photographer" data-my="မင်္ဂလာဆောင်နှင့် Portrait ဓာတ်ပုံဆရာ">Wedding & Portrait Photographer</option>
                    <option value="Marathon Runner" data-en="Marathon Runner" data-my="မာရသွန်အပြေးသမား">Marathon Runner</option>
                    <option value="Corporate Lawyer" data-en="Corporate Lawyer" data-my="Corporateရှေ့နေ">Corporate Lawyer</option>
                    <option value="Operations Supervisor" data-en="Operations Supervisor" data-my="Operations Supervisor">Operations Supervisor</option>
                    <option value="Creative Designer" data-en="Creative Designer" data-my="Creative Designer">Creative Designer</option>
                    <option value="Doctor" data-en="Doctor" data-my="ဆရာဝန်">Doctor</option>
                    <option value="Teacher" data-en="Teacher" data-my="ဆရာမ">Teacher</option>
                    <option value="Office Worker" data-en="Office Worker" data-my="ရုံးဝန်ထမ်း">Office Worker</option>
                    <option value="Student" data-en="Student" data-my="ကျောင်းသူ">Student</option>
                    <option value="Freelance Graphic Designer" data-en="Freelance Graphic Designer" data-my="Freelance Graphic Designer">Freelance Graphic Designer</option>
                    <option value="Local Bakery Owner" data-en="Local Bakery Owner" data-my="ပြည်တွင်းမုန့်တိုက်ပိုင်ရှင်">Local Bakery Owner</option>
                    <option value="Auto Mechanic" data-en="Auto Mechanic" data-my="စက်ပြင်">Auto Mechanic</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="modal-button apply-filters" id="applyFilters" data-en="Apply Filters" data-my="စစ်ထုတ်မှုများ အသုံးပြုရန်">Apply Filters</button>
                <button class="modal-button reset-filters" id="resetFilters" data-en="Reset" data-my="ပြန်လည်သတ်မှတ်ရန်">Reset</button>
            </div>
        </div>
    </div>

   <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 1.  STATE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let profilesData = null; // Will hold fetched data
    let isLoading = true;

    // Filter state
    let selectedPurpose = 'all';
    let selectedTier = 'all';
    let selectedCareer = 'all';
    let currentLanguage = 'en';
    let currentSearchQuery = '';
    let currentTagFilter = 'all';

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 2.  DOM REFS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const grid = document.getElementById('profilesGrid');
    const filterBtn = document.getElementById('filterBtn');
    const modal = document.getElementById('filterModal');
    const closeModalBtn = document.getElementById('closeModal');
    const applyBtn = document.getElementById('applyFilters');
    const resetBtn = document.getElementById('resetFilters');

    const purposeTabs = document.querySelectorAll('.purpose-tab');
    const tierOptions = document.querySelectorAll('.filter-option');
    const careerSelect = document.getElementById('careerSelect');

    const langBtn = document.querySelector('.language-btn');
    const langOptions = document.querySelector('.language-options');
    const langOpts = document.querySelectorAll('.language-option');
    const currentLangSpan = document.getElementById('current-language');

    const searchBox = document.querySelector('.search-box');
    const categoryTags = document.querySelectorAll('.category-tag');

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 3.  HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function formatCurrency(amount) {
        if (currentLanguage === 'my') {
            return amount.toLocaleString('en-US') + ' ကျပ်';
        }
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'MMK',
            minimumFractionDigits: 0
        }).format(amount);
    }

    function getLangText(el, fallback) {
        const key = currentLanguage === 'my' ? 'data-my' : 'data-en';
        return el.getAttribute(key) || fallback || el.textContent;
    }

    function showLoadingState() {
        grid.innerHTML = `
            <div class="no-results" style="grid-column:1/-1;text-align:center;padding:3rem 1rem;font-size:1.2rem;color:var(--text-light);background:white;border-radius:12px;box-shadow:var(--shadow);">
                <i class="fas fa-spinner fa-spin" style="font-size:2rem;display:block;margin-bottom:1rem;color:var(--basic-color);"></i>
                ${currentLanguage === 'my' ? 'ဒေတာများ ယူဆောင်လာနေသည်...' : 'Loading templates...'}
            </div>
        `;
    }

    function showErrorState(message) {
        grid.innerHTML = `
            <div class="no-results" style="grid-column:1/-1;text-align:center;padding:3rem 1rem;font-size:1.2rem;color:#e74c3c;background:white;border-radius:12px;box-shadow:var(--shadow);">
                <i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:1rem;color:#e74c3c;"></i>
                ${message || (currentLanguage === 'my' ? 'ဒေတာများ ရယူရာတွင် အမှားအယွင်းရှိသည်။' : 'Failed to load templates.')}
                <br><small style="font-weight:400;color:var(--text-light);">${currentLanguage === 'my' ? 'ကျေးဇူးပြု၍ စာမျက်နှာကို ပြန်လည်စတင်ပါ။' : 'Please refresh the page.'}</small>
            </div>
        `;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 4.  FETCH DATA
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    async function fetchProfilesData() {
        const jsonPath = './json/product.json'; // relative to index.html

        try {
            const response = await fetch(jsonPath);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} – ${response.statusText}`);
            }

            const data = await response.json();

            if (!data || !data.profiles || !Array.isArray(data.profiles)) {
                throw new Error('Invalid data structure: missing "profiles" array.');
            }

            profilesData = data;
            isLoading = false;
            return data;

        } catch (error) {
            console.error('[ProfileCraft] Failed to fetch product.json:', error);
            isLoading = false;
            profilesData = null;
            showErrorState(
                currentLanguage === 'my'
                    ? 'ဒေတာများ ရယူရာတွင် အမှားအယွင်းရှိသည်။'
                    : 'Failed to load template data.'
            );
            throw error;
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 5.  RENDER CARDS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function createProfileCard(profile) {
        const hasDiscount = profile.discountPrice !== null;
        const careerText = currentLanguage === 'my' && profile.careerMy ? profile.careerMy : profile.career;
        const buyText = currentLanguage === 'my' ? 'ဝယ်ယူရန်' : 'Buy';
        const previewText = currentLanguage === 'my' ? 'စစ်ဆေးကြည့်ရန်' : 'Live Preview';
        const saveText = currentLanguage === 'my' ? 'သက်သာငွေ' : 'Save';

        const tierLabel = currentLanguage === 'my'
            ? (profile.category === 'Basic' ? 'အခြေခံ' : profile.category === 'Standard' ? 'စံ' : 'အဆင့်မြင့်')
            : profile.category;

        return `
            <div class="profile-card"
                 data-purpose="${profile.purpose || 'business'}"
                 data-tier="${profile.category}"
                 data-career="${profile.career}"
                 data-id="${profile.id}"
                 data-popular="${profile.popular}"
                 data-new="${profile.isNew}"
                 data-free="${profile.isFree}">
                <div class="card-image">
                    <img src="${profile.image}" alt="${profile.name}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect fill=%22%23f1f2f6%22 width=%22300%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-family=%22Inter,sans-serif%22 font-size=%2216%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                    <div class="badges">
                        <span class="category-badge ${profile.category.toLowerCase()}-badge">${tierLabel}</span>
                        ${profile.popular ? `<span class="popular-badge">⭐ ${currentLanguage === 'my' ? 'လူကြိုက်များ' : 'Popular'}</span>` : ''}
                        ${profile.isNew ? `<span class="popular-badge" style="background-color:#00cec9;">${currentLanguage === 'my' ? 'အသစ်' : 'New'}</span>` : ''}
                        ${profile.isFree ? `<span class="popular-badge" style="background-color:#00b894;">${currentLanguage === 'my' ? 'အခမဲ့' : 'Free'}</span>` : ''}
                    </div>
                </div>
                <div class="card-content">
                    <h3 class="profile-name">${profile.id}</h3>
                    <p class="profile-career">${careerText}</p>
                    <div class="price-container">
                        ${hasDiscount
                            ? `<span class="original-price">${formatCurrency(profile.price)}</span>
                               <span class="current-price">${formatCurrency(profile.discountPrice)}</span>
                               <span class="discount-badge">${saveText} ${Math.round((profile.price - profile.discountPrice) / profile.price * 100)}%</span>`
                            : `<span class="current-price">${formatCurrency(profile.price)}</span>`
                        }
                    </div>
                    <div class="card-actions">
                        <button class="cta-button buy-button"
                                data-id="${profile.id}"
                                data-purpose="${profile.purpose || 'business'}"
                                data-tier="${profile.category}"
                                data-name="${profile.name}">${buyText}</button>
                        <button class="cta-button preview-button"
                                data-image="${profile.image}">${previewText}</button>
                    </div>
                </div>
            </div>
        `;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 6.  FILTER ENGINE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function filterAndRender() {
        // Guard: if data isn't loaded yet, show loading
        if (isLoading || !profilesData) {
            if (!isLoading && !profilesData) {
                showErrorState(currentLanguage === 'my' ? 'ဒေတာများ မရရှိနိုင်ပါ။' : 'Data unavailable.');
            } else {
                showLoadingState();
            }
            return;
        }

        const filtered = profilesData.profiles.filter(profile => {
            // — purpose —
            if (selectedPurpose !== 'all' && profile.purpose !== selectedPurpose) return false;

            // — tier —
            if (selectedTier !== 'all' && profile.category !== selectedTier) return false;

            // — career —
            if (selectedCareer !== 'all' && profile.career !== selectedCareer) return false;

            // — tag (popular / new / free) —
            if (currentTagFilter === 'popular' && !profile.popular) return false;
            if (currentTagFilter === 'new' && !profile.isNew) return false;
            if (currentTagFilter === 'free' && !profile.isFree) return false;

            // — search —
            if (currentSearchQuery) {
                const q = currentSearchQuery.toLowerCase();
                const nameMatch = profile.name.toLowerCase().includes(q);
                const careerMatch = profile.career.toLowerCase().includes(q);
                const careerMyMatch = profile.careerMy && profile.careerMy.toLowerCase().includes(q);
                if (!nameMatch && !careerMatch && !careerMyMatch) return false;
            }

            return true;
        });

        grid.innerHTML = '';

        if (filtered.length === 0) {
            const msg = currentLanguage === 'my' ? 'ရလဒ်မတွေ့ပါ' : 'No results found';
            grid.innerHTML = `<div class="no-results">${msg}</div>`;
            return;
        }

        filtered.forEach((profile, i) => {
            const html = createProfileCard(profile);
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            const card = wrapper.firstElementChild;
            card.style.animationDelay = `${i * 0.08}s`;
            grid.appendChild(card);
        });

        bindCardEvents();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 7.  CARD EVENTS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function bindCardEvents() {
        document.querySelectorAll('.buy-button').forEach(btn => {
            btn.removeEventListener('click', handleBuy);
            btn.addEventListener('click', handleBuy);
        });

        document.querySelectorAll('.preview-button').forEach(btn => {
            btn.removeEventListener('click', handlePreview);
            btn.addEventListener('click', handlePreview);
        });
    }

    function handleBuy(e) {
        const btn = e.currentTarget;
        const card = btn.closest('.profile-card');
        if (!card) return;

        const info = {
            id: card.dataset.id || btn.dataset.id,
            purpose: card.dataset.purpose || btn.dataset.purpose || 'business',
            tier: card.dataset.tier || btn.dataset.tier,
            name: btn.dataset.name || '',
        };

        localStorage.setItem('selected_template_info', JSON.stringify(info));
        window.location.href = 'details.html';
    }

    function handlePreview(e) {
        const btn = e.currentTarget;
        const imgUrl = btn.dataset.image;
        if (imgUrl) {
            window.open(imgUrl, '_blank');
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 8.  MODAL CONTROLS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function openModal() {
        modal.classList.add('active');
        syncModalUI();
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    function syncModalUI() {
        purposeTabs.forEach(tab => {
            tab.classList.toggle('active', tab.dataset.purpose === selectedPurpose);
        });
        tierOptions.forEach(opt => {
            opt.classList.toggle('active', opt.dataset.tier === selectedTier);
        });
        careerSelect.value = selectedCareer;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 9.  APPLY / RESET
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function applyFilters() {
        const activePurpose = document.querySelector('.purpose-tab.active');
        selectedPurpose = activePurpose ? activePurpose.dataset.purpose : 'all';

        const activeTier = document.querySelector('.filter-option.active');
        selectedTier = activeTier ? activeTier.dataset.tier : 'all';

        selectedCareer = careerSelect.value;

        filterAndRender();
        closeModal();
    }

    function resetFilters() {
        purposeTabs.forEach(tab => tab.classList.remove('active'));
        document.querySelector('.purpose-tab[data-purpose="all"]')?.classList.add('active');

        tierOptions.forEach(opt => opt.classList.remove('active'));
        document.querySelector('.filter-option[data-tier="all"]')?.classList.add('active');

        careerSelect.value = 'all';

        selectedPurpose = 'all';
        selectedTier = 'all';
        selectedCareer = 'all';

        filterAndRender();
        closeModal();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 10. LANGUAGE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function setLanguage(lang) {
        currentLanguage = lang;
        currentLangSpan.textContent = lang === 'en' ? 'English' : 'Myanmar';

        if (lang === 'my') {
            document.body.classList.add('myanmar');
        } else {
            document.body.classList.remove('myanmar');
        }

        // Placeholders
        document.querySelectorAll('[data-en-placeholder]').forEach(el => {
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = el.getAttribute(`data-${lang}-placeholder`) || el.getAttribute('data-en-placeholder');
            }
        });

        // Generic data-en/data-my elements (skip tabs/options handled below)
        document.querySelectorAll('[data-en][data-my]:not(.purpose-tab):not(.filter-option)').forEach(el => {
            const txt = el.getAttribute(`data-${lang}`);
            if (txt) el.textContent = txt;
        });

        // Purpose tabs
        purposeTabs.forEach(tab => {
            const txt = tab.getAttribute(`data-${lang}`);
            if (txt) tab.textContent = txt;
        });

        // Tier options
        tierOptions.forEach(opt => {
            const txt = opt.getAttribute(`data-${lang}`);
            if (txt) opt.textContent = txt;
        });

        // Career options
        careerSelect.querySelectorAll('option').forEach(opt => {
            const txt = opt.getAttribute(`data-${lang}`);
            if (txt) opt.textContent = txt;
        });

        // Category tags
        categoryTags.forEach(tag => {
            const txt = tag.getAttribute(`data-${lang}`);
            if (txt) tag.textContent = txt;
        });

        // Filter button
        const filterSpan = filterBtn.querySelector('span');
        if (filterSpan) {
            const txt = filterBtn.getAttribute(`data-${lang}`);
            if (txt) filterSpan.textContent = txt;
        }

        filterAndRender();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 11. CATEGORY TAGS (top bar)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function initCategoryTags() {
        categoryTags.forEach(tag => {
            tag.addEventListener('click', function() {
                categoryTags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentTagFilter = this.dataset.category || 'all';
                filterAndRender();
            });
        });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 12. INITIALIZATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    async function initApp() {
        // Show loading state immediately
        showLoadingState();

        // Set up event listeners (they will work once data is loaded)
        setupEventListeners();

        try {
            // Fetch data
            await fetchProfilesData();

            // If fetch succeeded, render
            if (profilesData && profilesData.profiles) {
                filterAndRender();
            } else {
                showErrorState(currentLanguage === 'my' ? 'ဒေတာများ ဗလာဖြစ်နေသည်။' : 'Data is empty.');
            }
        } catch (error) {
            // Error already handled in fetchProfilesData, but just in case
            if (!grid.querySelector('.no-results')) {
                showErrorState(currentLanguage === 'my' ? 'ဒေတာများ ရယူရာတွင် အမှားအယွင်းရှိသည်။' : 'Failed to load templates.');
            }
        }
    }

    function setupEventListeners() {
        // Modal open
        filterBtn.addEventListener('click', openModal);

        // Modal close
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Purpose tabs
        purposeTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                purposeTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Tier options
        tierOptions.forEach(opt => {
            opt.addEventListener('click', function() {
                tierOptions.forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Apply / Reset
        applyBtn.addEventListener('click', applyFilters);
        resetBtn.addEventListener('click', resetFilters);

        // Language
        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langOptions.classList.toggle('active');
        });
        document.addEventListener('click', () => langOptions.classList.remove('active'));

        langOpts.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                const lang = this.dataset.lang;
                setLanguage(lang);
                langOptions.classList.remove('active');
            });
        });

        // Search
        searchBox.addEventListener('input', function() {
            currentSearchQuery = this.value;
            filterAndRender();
        });

        // Category tags
        initCategoryTags();

        // Career select — apply on change (optional: you can also keep it via Apply button)
        // We'll let Apply button handle it, but we also update state on change for consistency
        careerSelect.addEventListener('change', function() {
            // state will be read when Apply is clicked
        });
    }

    // ─── Boot ───
    document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
